<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Notes</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Lees">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<script>if(!/Mac|iPhone|iPad|iPod/.test(navigator.platform||navigator.userAgent))document.documentElement.classList.add("emo-noto");</script>
<link rel="stylesheet" href="/lees-patch.css?v=31">
<style>
:root{
  --bg:#f8f4ee;--surface:#fffdf9;--ink:#2a2420;--muted:#8c8179;--line:#ebe2d7;--line-strong:#dcd0c2;
  --mine:#e8d5bf;--mine-ink:#2a2420;--theirs:#ffffff;--accent:#9a5a48;--accent-ink:#fff;
  --lilac:#7d6a9b;--sage:#6f8f7a;--rose:#b5534a;
  --shadow:0 1px 2px rgba(42,36,32,.06),0 8px 24px rgba(42,36,32,.06);
  --ease:cubic-bezier(.2,.8,.2,1);
  --emoji-font:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",serif,var(--emoji-font);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif,var(--emoji-font);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace,var(--emoji-font);
}
[data-theme="ink"]{--bg:#171412;--surface:#211d1a;--ink:#f1ebe4;--muted:#948a82;--line:#342e29;--line-strong:#4a413a;--mine:#3f342c;--mine-ink:#f1ebe4;--theirs:#262120;--accent:#d69a84;--accent-ink:#1d1a18;--lilac:#b5a3d6;--sage:#9cc2aa;--rose:#e08b80;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}
[data-theme="sage"]{--bg:#eef3ee;--surface:#fbfdfb;--ink:#1f2b24;--muted:#6f8577;--line:#dbe5dc;--line-strong:#c4d3c6;--mine:#cfe3d3;--mine-ink:#1f2b24;--theirs:#fff;--accent:#4f7a5e;--accent-ink:#fff;--lilac:#6d7fa0;--sage:#4f7a5e;--rose:#b5534a}
[data-theme="rose"]{--bg:#faf1f2;--surface:#fffafa;--ink:#3a2327;--muted:#8f6b71;--line:#f0dfe1;--line-strong:#e2c9cc;--mine:#f3d3d8;--mine-ink:#3a2327;--theirs:#fff;--accent:#b04a63;--accent-ink:#fff;--lilac:#9a6b8f;--sage:#b5788a;--rose:#b04a63}
[data-theme="cream"]{--bg:#fbf8ef;--surface:#fffef9;--ink:#33301f;--muted:#8a8462;--line:#eee9d4;--line-strong:#ddd5b4;--mine:#f0e6b8;--mine-ink:#33301f;--theirs:#fff;--accent:#8a7417;--accent-ink:#fff;--lilac:#8a7417;--sage:#6f8f4a;--rose:#a5523e}
[data-theme="glass"]{--bg:#0d1020;--surface:#161b30;--ink:#e8ecfa;--muted:#8389a8;--line:#262d4a;--line-strong:#363f63;--mine:#2a3266;--mine-ink:#eef1ff;--theirs:#1a2038;--accent:#7cc6ff;--accent-ink:#0a0f20;--lilac:#9d8cff;--sage:#6fd6b0;--rose:#ff8fa6}
[data-theme="rose-garden"]{--bg:#fbeef2;--surface:#fff7f9;--ink:#3d1f2b;--muted:#9a6f7e;--line:#efcfd9;--line-strong:#e4b8c6;--mine:#f6d3de;--mine-ink:#3d1f2b;--theirs:#ffffff;--accent:#c2476f;--accent-ink:#fff;--rose:#c2476f}
[data-theme="lavender-mist"]{--bg:#f3eff9;--surface:#fcfbff;--ink:#2f2740;--muted:#7d7196;--line:#ddd4ec;--line-strong:#cbbfe0;--mine:#e4dcf5;--mine-ink:#2f2740;--theirs:#ffffff;--accent:#7d5bbd;--accent-ink:#fff;--rose:#7d5bbd}
[data-theme="ocean-glass"]{--bg:#e9f3f6;--surface:#f8fcfd;--ink:#1c3440;--muted:#5f8291;--line:#c9e0e7;--line-strong:#b3d2dc;--mine:#d3eaf1;--mine-ink:#1c3440;--theirs:#ffffff;--accent:#2f7f98;--accent-ink:#fff;--rose:#2f7f98}
[data-theme="forest-ink"]{--bg:#1e2a24;--surface:#26342c;--ink:#e6f0e9;--muted:#9fb8a6;--line:#3a4d41;--line-strong:#4d6356;--mine:#34483b;--mine-ink:#e6f0e9;--theirs:#26342c;--accent:#7fb08d;--accent-ink:#142018;--rose:#7fb08d}
[data-theme="sunset-clay"]{--bg:#f7ebe3;--surface:#fffaf6;--ink:#4a2c1f;--muted:#9b7564;--line:#ebd3c4;--line-strong:#dfc2ae;--mine:#f2d9c9;--mine-ink:#4a2c1f;--theirs:#ffffff;--accent:#c06a4b;--accent-ink:#fff;--rose:#c06a4b}
[data-theme="peach-linen"]{--bg:#fdf3ea;--surface:#fffbf6;--ink:#3f2a20;--muted:#97776a;--line:#f0dccb;--line-strong:#e4cbb6;--mine:#fbe2cf;--mine-ink:#3f2a20;--theirs:#ffffff;--accent:#e0875a;--accent-ink:#fff;--rose:#e0875a}
[data-theme="slate-blue"]{--bg:#eceff4;--surface:#f8f9fc;--ink:#1f2a3c;--muted:#6b7a92;--line:#d5dce8;--line-strong:#c3cde0;--mine:#dbe4f1;--mine-ink:#1f2a3c;--theirs:#ffffff;--accent:#4a6fa5;--accent-ink:#fff;--rose:#4a6fa5}
[data-theme="cocoa-milk"]{--bg:#efe6df;--surface:#f9f3ee;--ink:#36251d;--muted:#8a6e60;--line:#dccbbd;--line-strong:#cdb8a6;--mine:#e6d4c6;--mine-ink:#36251d;--theirs:#fbf7f4;--accent:#8b5a3c;--accent-ink:#fff;--rose:#8b5a3c}
[data-theme="mint-frost"]{--bg:#eaf6f1;--surface:#f7fcfa;--ink:#1d3a30;--muted:#6a8d80;--line:#cbe6dc;--line-strong:#b6d9cc;--mine:#d3eee4;--mine-ink:#1d3a30;--theirs:#ffffff;--accent:#3f9f7a;--accent-ink:#fff;--rose:#3f9f7a}
[data-theme="night-bloom"]{--bg:#1a1424;--surface:#241c31;--ink:#f1e8f7;--muted:#ab9bc0;--line:#3a2f4d;--line-strong:#4e4066;--mine:#3b2d4f;--mine-ink:#f1e8f7;--theirs:#241c31;--accent:#d77fb3;--accent-ink:#1a1018;--rose:#d77fb3}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:var(--vh,100dvh);overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;transition:background .6s var(--ease),color .6s var(--ease),filter .3s var(--ease);-webkit-touch-callout:none}
body.private{filter:blur(22px) saturate(.6)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
.hidden{display:none!important}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.sm{width:20px;height:20px}
.mono{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase}
.serif{font-family:var(--serif)}
.muted{color:var(--muted)}
.hdr{font-family:var(--serif);font-size:20px;letter-spacing:.01em;margin:0}

/* ---------- Sign-in ---------- */
#lock{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px;gap:10px;overflow-y:auto;animation:rise .5s var(--ease) both;z-index:30;background:var(--bg)}
.monoArt{width:min(300px,86vw);height:auto;color:var(--ink);overflow:visible}
.monoArt *{vector-effect:non-scaling-stroke}
.monoArt .star{transform-box:fill-box;transform-origin:center;animation:twinkle 2.8s ease-in-out infinite}
.monoArt .armL{transform-origin:116px 150px;animation:lpArmL 14s ease-in-out infinite}
.monoArt .armR{transform-origin:244px 150px;animation:lpArmR 14s ease-in-out infinite}
.monoArt .headL{transform-origin:150px 130px;animation:lpHeadL 14s ease-in-out infinite}
.monoArt .headR{transform-origin:212px 130px;animation:lpHeadR 14s ease-in-out infinite}
@keyframes lpArmL{0%,8%{transform:rotate(0)}16%{transform:rotate(146deg)}19%,28%{transform:rotate(140deg)}34%,68%{transform:rotate(0)}72%,82%{transform:rotate(140deg)}88%,100%{transform:rotate(0)}}
@keyframes lpArmR{0%,42%{transform:rotate(0)}46%{transform:rotate(-146deg)}49%,54%{transform:rotate(-140deg)}60%,68%{transform:rotate(0)}72%,82%{transform:rotate(-140deg)}88%,100%{transform:rotate(0)}}
@keyframes lpHeadL{0%,14%{transform:rotate(0)}19%,28%{transform:rotate(-3deg)}34%,70%{transform:rotate(0)}72%,82%{transform:rotate(-3deg)}88%,100%{transform:rotate(0)}}
@keyframes lpHeadR{0%,44%{transform:rotate(0)}49%,54%{transform:rotate(3deg)}60%,70%{transform:rotate(0)}72%,82%{transform:rotate(3deg)}88%,100%{transform:rotate(0)}}
@keyframes twinkle{0%,100%{opacity:.2}40%{opacity:1}70%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.monoArt .star,.monoArt .armL,.monoArt .armR,.monoArt .headL,.monoArt .headR{animation:none!important}}
.monoArt.checking{filter:none;opacity:1}
.acct-switch{position:relative;width:min(260px,100%);height:46px;display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:23px;background:color-mix(in srgb,var(--bg) 70%,var(--surface));border:1px solid var(--line);overflow:hidden}
.acct-switch::before{content:"";position:absolute;top:3px;left:3px;width:calc(50% - 3px);height:calc(100% - 6px);border-radius:20px;background:var(--ink);transition:transform .6s cubic-bezier(.4,0,.2,1);z-index:0}
.acct-switch.is-right::before{transform:translateX(100%)}
.acct-switch button{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 8px;border-radius:20px;background:transparent;font-family:var(--serif);font-size:17px;color:var(--muted);transition:color .6s ease}
.acct-switch button .av{width:22px;height:22px;font-size:11px}
.acct-switch button[aria-pressed="true"]{color:var(--bg)}
#lockForm #pass{font-size:30px;padding-top:22px;padding-bottom:22px;min-height:84px}
#lockForm .btn{font-size:22px;min-height:60px;padding:16px 22px}
#lock .sub{font-size:19px}
#forgot{font-size:17px}
.media-grid{display:grid;grid-template-columns:1fr;gap:12px}
.media-kind{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:6px;width:100%;min-height:132px;padding:18px 16px;border-radius:28px;background:
  radial-gradient(140px 90px at 100% 0%, color-mix(in srgb,var(--accent) 22%,transparent), transparent 70%),
  var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left;transform-style:preserve-3d}
.media-kind .mark{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,var(--bg));color:var(--accent);margin-bottom:8px}
.media-kind b{font-family:var(--serif);font-weight:normal;font-size:26px}
.media-kind small{color:var(--muted);font-size:14px}
.media-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.media-card{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:26px;background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 24px rgba(42,36,32,.08);min-width:0;transform-style:preserve-3d}
.media-card img,.media-card video{width:100%;height:148px;object-fit:cover;border-radius:18px;background:#141210}
.media-card audio{width:100%}
.media-card .cap{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.media-card .acts{display:flex;flex-wrap:wrap;gap:6px}
.who-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.who-card{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:6px;width:100%;min-height:168px;padding:16px;border-radius:26px;background:
  radial-gradient(120px 80px at 0% 0%, color-mix(in srgb,var(--accent) 16%,transparent), transparent 72%),
  var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left;transform-style:preserve-3d}
.who-card .av{width:44px;height:44px;font-size:18px}
.who-card b{font-family:var(--serif);font-weight:normal;font-size:22px}
.who-card small{color:var(--muted);font-size:13px}
.who-card.me{opacity:.45}
.heldvoice{display:flex;align-items:center;gap:10px;margin:0 12px 8px;padding:8px 10px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.heldvoice .heldlabel{flex:1;min-width:0;font-size:13.5px;color:var(--ink)}
#lock h1{font-family:var(--serif);font-weight:normal;font-size:26px;margin:0}
#tagline{font-family:var(--serif);font-style:italic;color:var(--accent);font-size:16px;min-height:1.6em;margin:0;text-align:center}
#tagline::after{content:"▍";margin-left:2px;opacity:.7;animation:blink 1s steps(1) infinite}
#tagline.done::after{opacity:0}
#tagline.done{animation:breathe 4.5s ease-in-out infinite}
#notYou{display:none;color:var(--accent);font-size:13px;text-decoration:underline;text-underline-offset:3px}
#lock .sub{color:var(--muted);margin:0;font-size:14px}
#lock.remembered #acctSwitch,#lock.remembered .sub{display:none}
#lock.remembered #lock.remembered #notYou{display:inline-block}
.form{display:none;flex-direction:column;gap:10px;width:min(320px,100%)}
.form.on{display:flex}
.field{position:relative}
.in{width:100%;padding:13px 46px 13px 15px;border:1px solid var(--line);border-radius:14px;background:var(--surface);outline:none;transition:border-color .2s;font-size:16px}
.in.plain{padding-right:15px}
.in:focus{border-color:var(--accent)}
select.in{padding-right:12px}
#peek{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:grid;place-items:center;color:var(--muted);border-radius:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-size:17px;transition:transform .15s var(--ease),opacity .2s}
.btn:active{transform:scale(.98)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--rose);border:1px solid var(--rose)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.link{color:var(--accent);font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--rose)}
#lockErr{color:var(--rose);min-height:1.2em;font-size:13.5px;text-align:center}
.shake{animation:shake .4s}

/* ---------- Views ---------- */
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px);animation:fade .35s var(--ease) both}
#chat,#panel{animation:none;z-index:4;transition:transform .46s cubic-bezier(.32,.72,0,1)}
#chat.ios-prep,#panel.ios-prep,#chat.ios-leave,#panel.ios-leave{transform:translateX(100%)}
#panelBody.ios-body{animation:iosbody .42s cubic-bezier(.32,.72,0,1)}
@keyframes iosbody{from{transform:translateX(28%);opacity:.55}to{transform:none;opacity:1}}
.topbar{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface);min-height:58px}
.topbar .grow{flex:1;min-width:0}
.topbar .title{font-family:var(--serif);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none;transition:color .2s,background .2s}
.ibtn:hover{color:var(--ink);background:var(--bg)}
.ibtn.on{color:var(--accent)}
.ibtn.danger{color:var(--rose)}
.avatar{width:36px;height:36px;aspect-ratio:1/1;overflow:hidden;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--serif);font-size:15px;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover;aspect-ratio:1/1;display:block}
.avatar.lewis{background:var(--lilac)}
.avatar.agnes{background:var(--sage)}

/* Home (journal) */
#home .scroll{flex:1;min-height:0;overflow-y:auto;padding:18px 16px 40px}
.greet{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:2px 2px 16px}
.greet .hdr{font-size:clamp(28px,8vw,40px);letter-spacing:-.02em;line-height:1.05}
.greet .mono{margin-top:6px;color:var(--muted)}
.journal-btn{width:48px;height:48px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--accent)}
.navrow{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0 8px}
.homegrid{display:grid;grid-template-columns:0.82fr 1.45fr;gap:10px;align-items:stretch}
.navbtn.settings-box{width:100%;height:100%;min-height:0;align-self:stretch;flex-direction:column;align-items:stretch;justify-content:space-between;font-size:18px;padding:16px;gap:12px;border-radius:28px}
.settings-main{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:10px;flex:1;text-align:center;font-size:22px;color:var(--ink)}
.signout-wrap{border-radius:16px;overflow:hidden;background:#e0463c;box-shadow:0 6px 16px rgba(224,70,60,.35)}
.settings-out{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 12px;border:0;background:transparent;color:#fff;font-size:16px;font-weight:600}
.fnbox{display:flex;flex-direction:column;gap:8px;min-height:320px;height:100%;padding:12px;border-radius:28px;background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid var(--line);box-shadow:var(--shadow)}
.tools2{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
.tools2 .navbtn{width:100%;white-space:normal;text-align:left}
.navbtn{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:16px;background:color-mix(in srgb,var(--surface) 86%,transparent);border:1px solid var(--line);white-space:nowrap;font-size:15px;color:var(--ink);flex:none;box-shadow:var(--shadow)}
.navbtn.journal-tool{min-height:54px;font-family:var(--serif);font-size:18px;color:var(--accent);background:linear-gradient(165deg,color-mix(in srgb,var(--accent) 18%,var(--surface)),var(--surface));border-color:color-mix(in srgb,var(--accent) 42%,var(--line))}
.navbtn.journal-tool .i{width:28px;height:28px}
@media (max-width:720px){
  .homegrid{grid-template-columns:0.86fr 1.22fr;gap:6px}
  .navbtn.settings-box{min-height:0;padding:10px 8px;gap:8px;border-radius:28px}
  .settings-main{font-size:16px;gap:6px}
  .settings-out{font-size:13px;padding:8px 6px}
  .fnbox{min-height:0;padding:8px;gap:6px}
  .tools2{gap:6px}
  .tools2 .navbtn{padding:8px 7px;font-size:12.5px;gap:5px}
  .navbtn.journal-tool{min-height:42px;font-size:14px}
  .navbtn.journal-tool .i{width:20px;height:20px}
}
#play{display:none}
.live-slot{margin-top:4px}
.play-go{display:block;width:100%;padding:14px 16px;border-radius:22px;background:color-mix(in srgb,var(--accent) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));font-family:var(--serif);font-size:18px;color:var(--accent)}
.play-board{margin-top:12px;padding:14px;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.play-who{display:flex;gap:8px;margin-bottom:10px}
.play-who-one{flex:1;padding:8px 10px;border-radius:14px;border:1px solid var(--line);background:var(--bg)}
.play-who-one.on{border-color:var(--accent);color:var(--accent)}
.play-who-one b{display:block;font-weight:normal;font-family:var(--serif);font-size:15px}
.play-who-one span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.play-time{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
.play-time.hot{color:var(--rose)}
.play-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.play-cell{aspect-ratio:1;border-radius:16px;border:1px solid var(--line);background:var(--bg);font-family:var(--serif);font-size:28px;color:var(--ink)}
.play-cell:disabled{opacity:.85}
.play-again{margin-top:10px}
.navbtn.danger{color:var(--rose)}
.person.hero{width:100%;padding:18px 16px;border-radius:28px;background:linear-gradient(165deg,color-mix(in srgb,var(--surface) 88%,var(--accent)),var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));box-shadow:var(--shadow);transform-style:preserve-3d}
.person.hero .avatar{width:52px;height:52px;font-size:20px}
.person.hero .n{font-size:22px}
.person.hero .s{font-size:13px;margin-top:2px}

/* Chat */

mark{background:rgba(214,154,132,.45);color:inherit;border-radius:4px;padding:0 2px}

#chat{padding:6px 2px 8px}
#list{flex:1;min-height:0;overflow-y:auto;overflow-anchor:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;margin:4px 0 10px;padding:18px 0 22px;display:flex;flex-direction:column;gap:18px}

.day{align-self:center;color:var(--muted);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;margin:12px 0 8px;padding:4px 12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;text-transform:uppercase}

.row.theirs{align-self:flex-start}

.msgav{width:32px;height:32px;font-size:13px}
.msg .text{display:block;background:none;border:0;box-shadow:none;padding:0;margin:0;border-radius:0}
.msg{position:relative;max-width:min(280px,72vw);padding:14px 18px 12px;border-radius:26px;font-size:17px;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 2px 10px rgba(80,30,45,.07);-webkit-touch-callout:none;user-select:text;-webkit-user-select:text;touch-action:manipulation}
.mine .msg{background:var(--mine);color:var(--mine-ink)}

.quote{display:flex;flex-direction:column;gap:1px;padding:6px 10px;margin-bottom:6px;border-left:2px solid var(--accent);border-radius:8px;background:rgba(154,90,72,.08);font-size:12.5px;color:var(--muted)}

.miniheart{position:fixed;z-index:50;width:22px;height:22px;color:#e0245e;pointer-events:none}
.miniheart svg{width:22px;height:22px;fill:#e0245e;stroke:#e0245e}

@keyframes heartpop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes heartshrink{0%{transform:scale(1)}100%{transform:scale(.75)}}
@keyframes igheart{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}35%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.4)}}
@keyframes bit{to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}
.row.fresh.in{opacity:1}

.scratch.gone{opacity:0;pointer-events:none}
.msg.reblur .text,.msg.reblur .photo,.msg.reblur .voice{filter:blur(9px);transition:filter .45s ease}
.msg.shimmer::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shim .6s ease;pointer-events:none}
@keyframes shim{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}

}
.edlabel{color:var(--muted);text-decoration:underline;text-underline-offset:2px}

@keyframes typingpop{0%{opacity:0;transform:scale(.42)}58%{opacity:1;transform:scale(1.22)}100%{opacity:1;transform:scale(1)}}

/* Instagram-style draw, floating above the chat */
#drawLayer{position:fixed;inset:0;z-index:74;display:flex;flex-direction:column;background:transparent;pointer-events:none}
#drawLayer.hidden{display:none}
#drawLayer .draw-top,#drawLayer .draw-bottom,#drawLayer .draw-size{pointer-events:auto}

.draw-top,.draw-bottom{display:flex;align-items:center;gap:6px;padding:8px 10px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.draw-top{margin:calc(8px + env(safe-area-inset-top,0px)) 10px 0;border-radius:18px;overflow-x:auto}

/* Thin banners */
.bar{position:fixed;left:10px;right:10px;z-index:45;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.18);animation:up .3s var(--ease) both;padding:6px}

.prow:last-child{border-bottom:0}
.prow .lab{display:flex;flex-direction:column;gap:2px;min-width:0}
.prow .lab small{color:var(--muted);font-size:12px}
.prow .in{width:auto;max-width:55%;padding:8px 10px;font-size:14px}
.gh{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 4px 8px}
.sw{position:relative;width:42px;height:24px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--line-strong);transition:background .25s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .3s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked + span{background:var(--accent)}
.sw input:checked + span::after{transform:translateX(18px)}
.wchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.wchips span{padding:4px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:12px;display:inline-flex;gap:6px;align-items:center}
.wchips button{color:var(--muted);display:grid;place-items:center}
.wchips .i{width:12px;height:12px}
.note-compose{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.note-compose textarea{width:100%;min-height:140px;resize:none;border:0;outline:none;background:none;font-family:var(--serif);font-size:17px;line-height:1.5}
.kinds{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.kinds .chip{cursor:pointer}
.count{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-align:right}
.item{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.item:last-child{border-bottom:0}
.item .txt{flex:1;min-width:0}
.item .txt span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.item .txt small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.row-acts{display:flex;flex-direction:column;gap:6px;flex:none}
.item img,.item video{width:72px;height:52px;border-radius:12px;object-fit:cover;background:#111}
.reading{font-family:var(--serif);font-size:18px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.reading-card{padding:20px 4px 22px;border-bottom:1px solid var(--line)}
.reading-card .meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;gap:8px;align-items:center}

/* Sheets (structured forms) */
#sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
#sheet .scrim{position:absolute;inset:0;background:rgba(10,8,7,.42);animation:fade .25s both}
#sheetBody{position:relative;width:min(540px,100%);max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.2);animation:up .35s var(--ease) both;border-top:1px solid var(--line)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line-strong);margin:4px auto 14px}
.fp-title{font-family:var(--serif);font-size:21px;margin:0 0 6px}
.fp-desc{color:var(--muted);font-size:13.5px;line-height:1.5;margin:0 0 14px}
.fp-field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.fp-field label{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.fp-err{color:var(--rose);font-size:13px;min-height:1.2em;margin:4px 0 8px}
.fp-acts{display:flex;gap:8px;margin-top:8px}
.fp-acts .btn{flex:1}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--bg);text-align:left;margin-bottom:8px}
.choice b{font-weight:normal;font-family:var(--serif);font-size:15.5px}
.choice small{color:var(--muted);font-size:12.5px;line-height:1.4}
.choice.danger b{color:var(--rose)}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes blink{50%{opacity:0}}
@keyframes breathe{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(154,90,72,.5)}100%{box-shadow:0 0 0 14px rgba(154,90,72,0)}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(214,154,132,.8)}100%{box-shadow:0 0 0 22px rgba(214,154,132,0)}}
@keyframes fxrise{0%{transform:translateY(0) scale(.6);opacity:0}12%{opacity:1}100%{transform:translateY(-110vh) rotate(25deg) scale(1.1);opacity:0}}
.fx{position:fixed;bottom:-30px;z-index:95;pointer-events:none;color:var(--accent);animation:fxrise 4.4s ease-out forwards}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

                if (/[A-Z]/.test(s) && /[a-z]/.test(s)) score++;
                if (/[0-9]/.test(s) || /[^A-Za-z0-9]/.test(s) || /\s/.test(s.trim())) score++;

  const TILE_SIZES = ["s", "w", "t", "l"];
  function applyTileSize(tile, size) {
    tile.classList.remove("sz-w", "sz-t", "sz-l");
    if (size && size !== "s") tile.classList.add("sz-" + size);
  }
  function attachHomeEdit(grid) {
    let timer = null, drag = null, moved = false;
    const ptrs = new Map(), base = { d: 0, tile: null };
    const tiles = () => [...grid.querySelectorAll(".navbtn[data-key]")];
    const setEdit = (on) => {
      grid.classList.toggle("editing", on);
      tiles().forEach((t) => t.classList.toggle("jig", on));
    };
    const saveSizes = () => {
      const sizes = {};
      tiles().forEach((t) => { const m = [...t.classList].find((c) => c.startsWith("sz-")); sizes[t.dataset.key] = m ? m.slice(3) : "s"; });
      store.set("pp-home-sizes", sizes);
    };
    const stepSize = (tile, dir) => {
      const cur = [...tile.classList].find((c) => c.startsWith("sz-"));
      const i = TILE_SIZES.indexOf(cur ? cur.slice(3) : "s");
      const j = Math.min(TILE_SIZES.length - 1, Math.max(0, i + dir));
      if (j === i) return;
      applyTileSize(tile, TILE_SIZES[j]);
      saveSizes();
    };
    const dist = () => { const [a, b] = [...ptrs.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
    grid.addEventListener("pointerdown", (e) => {
      const t = e.target.closest(".navbtn[data-key]");
      if (!t) return;
      if (grid.classList.contains("editing")) {
        ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, tile: t });
        if (ptrs.size === 1) drag = t;
        if (ptrs.size === 2) { drag = null; base.d = dist(); base.tile = t; }
        return;
      }
      moved = false;
      clearTimeout(timer);
      timer = setTimeout(() => { timer = null; moved = true; setEdit(true); }, 500);
    });
    grid.addEventListener("pointermove", (e) => {
      if (grid.classList.contains("editing") && ptrs.has(e.pointerId)) {
        ptrs.get(e.pointerId).x = e.clientX; ptrs.get(e.pointerId).y = e.clientY;
        if (ptrs.size === 2 && base.d > 0 && base.tile) {
          const r = dist() / base.d;
          if (r > 1.35) { stepSize(base.tile, 1); base.d = dist(); }
          else if (r < 0.75) { stepSize(base.tile, -1); base.d = dist(); }
        }
      }
      if (!drag) return;
      const under = document.elementFromPoint(e.clientX, e.clientY)?.closest(".navbtn[data-key]");
      if (!under || under === drag || !grid.contains(under)) return;
      const kids = [...grid.children];
      grid.insertBefore(drag, kids.indexOf(drag) < kids.indexOf(under) ? under.nextSibling : under);
    });
    const end = (e) => {
      clearTimeout(timer); timer = null;
      if (e && e.pointerId !== undefined) ptrs.delete(e.pointerId);
      if (ptrs.size < 2) { base.d = 0; base.tile = null; }
      if (drag && (!e || ptrs.size === 0)) { drag = null; store.set("pp-home-order", tiles().map((t) => t.dataset.key)); }
    };
    grid.addEventListener("pointerup", end);
    grid.addEventListener("pointercancel", end);
    grid.addEventListener("pointerleave", () => { if (!drag) { clearTimeout(timer); timer = null; } });
    let wheelAcc = 0;
    grid.addEventListener("wheel", (e) => {
      if (!grid.classList.contains("editing") || !e.ctrlKey) return;
      const t = e.target.closest(".navbtn[data-key]");
      if (!t) return;
      e.preventDefault();
      wheelAcc += e.deltaY;
      if (Math.abs(wheelAcc) >= 30) { stepSize(t, wheelAcc < 0 ? 1 : -1); wheelAcc = 0; }
    }, { passive: false });
    grid.addEventListener("click", (e) => {
      if (grid.classList.contains("editing") || moved) { e.stopPropagation(); e.preventDefault(); moved = false; }
    }, true);
    if (!window.__homeEditOutside) {
      window.__homeEditOutside = true;
      document.addEventListener("pointerdown", (e) => {
        const g = document.querySelector(".tools2.editing");
        if (g && !g.contains(e.target)) { g.classList.remove("editing"); g.querySelectorAll(".navbtn.jig").forEach((t) => t.classList.remove("jig")); }
      });
    }
  }

  function playEvents() {
    return thread().filter(isPlay).map(m => {
      const data = playPayload(m.text) || {};
      return { g: data.g, e: data.e, i: data.i, by: data.by || m.from, ts: m.ts };
    }).filter(e => e.g);
  }
  function playGames() {
    const map = new Map();
    for (const e of playEvents()) {
      if (!map.has(e.g)) map.set(e.g, { id: e.g, events: [] });
      map.get(e.g).events.push(e);
    }
    return [...map.values()];
  }
  function activePlay() {
    const all = playGames();
    for (let i = all.length - 1; i >= 0; i--) {
      if (!all[i].events.some(e => e.e === "win" || e.e === "draw")) return all[i];
    }
    return null;
  }
  function playCells(g) {
    const cells = Array(9).fill("");
    for (const e of g.events) {
      if ((e.e === "move" || e.e === "win" || e.e === "draw") && e.i >= 0 && e.i < 9 && !cells[e.i]) cells[e.i] = e.by;
    }
    return cells;
  }
  function playWinner(cells) {
    for (const line of PLAY_LINES) {
      const a = cells[line[0]];
      if (a && a === cells[line[1]] && a === cells[line[2]]) return a;
    }
    return "";
  }
  function playStarter(g) {
    const start = g.events.find(e => e.e === "start");
    return start ? start.by : (g.events[0] && g.events[0].by);
  }
  function playMark(side, g) { return side === playStarter(g) ? "X" : "O"; }
  function playTurn(g) {
    const starter = playStarter(g);
    if (!starter) return null;
    const moves = g.events.filter(e => e.i >= 0 && e.i < 9);
    const last = moves.length ? moves[moves.length - 1] : g.events[0];
    const due = last ? last.ts + PLAY_MS : 0;
    let side = moves.length % 2 === 0 ? starter : (starter === "Lewis" ? "Agnes" : "Lewis");
    if (last && Date.now() > due) side = side === "Lewis" ? "Agnes" : "Lewis";
    return side;
  }
  function playLeft(g) {
    const moves = g.events.filter(e => e.i >= 0 && e.i < 9);
    const last = moves.length ? moves[moves.length - 1] : g.events[0];
    return Math.max(0, Math.ceil(((last ? last.ts : Date.now()) + PLAY_MS - Date.now()) / 1000));
  }
  function playTally(side) {
    let w = 0, l = 0, d = 0;
    for (const g of playGames()) {
      const win = g.events.find(e => e.e === "win");
      if (win) { if (win.by === side) w++; else l++; }
      else if (g.events.some(e => e.e === "draw")) d++;
    }
    return { w, l, d, rating: 1000 + w * 18 - l * 12 + d * 3 };
  }

  // The lock-screen line types itself. In Rotate mode it cycles through several lines: types one, holds it,

  function typeTagline() {
    const DEFAULT_TAGLINE = "Do what you love, love what you do.";
    let lines = [DEFAULT_TAGLINE], mode = "one";
    try {
      const one = localStorage.getItem("pp-tagline") || DEFAULT_TAGLINE;
      mode = localStorage.getItem("pp-tagline-mode") || "one";
      const many = JSON.parse(localStorage.getItem("pp-taglines") || "[]").filter(Boolean);
      lines = mode === "rotate" && many.length ? many : [one];
    } catch (e) {}
    const t = $("tagline");
    clearTimeout(typeTagline.h);
    t.classList.remove("done");
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) {
      let k = 0;
      t.textContent = lines[0]; t.classList.add("done");
      if (lines.length > 1) { const step = () => { k = (k + 1) % lines.length; t.textContent = lines[k]; typeTagline.h = setTimeout(step, 5000); }; typeTagline.h = setTimeout(step, 5000); }
      return;
    }
    let li = 0, i = 0, dir = 1;
    const step = () => {
      const target = lines[li];
      if (dir > 0) {
        t.classList.remove("done");
        t.textContent = target.slice(0, ++i);
        if (i >= target.length) {
          t.classList.add("done");
          if (lines.length < 2) return;
          dir = -1; typeTagline.h = setTimeout(step, 3400); return;
        }
        typeTagline.h = setTimeout(step, 55);
      } else {
        t.classList.remove("done");
        t.textContent = target.slice(0, --i);
        if (i <= 0) { dir = 1; li = (li + 1) % lines.length; typeTagline.h = setTimeout(step, 380); return; }
        typeTagline.h = setTimeout(step, 22);
      }
    };
    t.textContent = "";
    step();
  }

  async function makeBackup() {
    const v = await formPanel({
      title: "Encrypted backup",
      desc: "Choose a passphrase for this backup. You will need it to restore. It is not stored anywhere.",
      fields: [{ key: "p", label: "Backup passphrase", type: "password", placeholder: "At least 6 characters" }],

    const media = [];

    const payload = JSON.stringify({ thread: thread(), media, notes: notesAll(), shared: SH(), settings: store.get(KEY.settings, {}) });
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await deriveKey(v.p, salt);
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(payload));
    download("our-conversation-" + new Date().toISOString().slice(0, 10) + ".ppbak", JSON.stringify({ v: 1, salt: b64(salt), iv: b64(iv), ct: b64(ct) }), "application/json");

  }

  async function restoreBackup(file) {
    const v = await formPanel({
      title: "Restore backup",
      desc: "Enter the passphrase you chose for this backup. Messages are merged with what is already here, never overwritten.",
      fields: [{ key: "p", label: "Backup passphrase", type: "password" }],
      submit: "Restore"
    });
    if (!v) return;
    try {
      const f = JSON.parse(await file.text());
      const key = await deriveKey(v.p, unb64(f.salt));
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(f.iv) }, key, unb64(f.ct));
      const data = JSON.parse(new TextDecoder().decode(pt));
      for (const x of data.media || []) await putBlob(x.id, await b64ToBlob(x.data));
      const list = thread();
      const have = new Set(list.map(m => m.id));
      for (const m of data.thread || []) if (!have.has(m.id)) list.push(m);
      list.sort((a, b) => a.ts - b.ts);
      saveThread(list);
      const nl = notesAll(), nh = new Set(nl.map(n => n.id));
      for (const n of data.notes || []) if (!nh.has(n.id)) nl.push(n);
      cacheNotes = nl;
      if (data.shared) setSH(data.shared);
      if (data.settings) { for (const side of Object.keys(data.settings)) setS(side, data.settings[side]); }
      render();
      renderHome();
      notice("Backup restored", "Messages, notes, shared settings, and each side's settings were merged.");
    } catch { notice("Couldn't open that backup", "Check the passphrase, or make sure the file is complete.", { error: true }); }
  }

      catch (e) {
        restore();
        micFail(e);
        return;
      }
      if (recWantStop) { stream.getTracks().forEach(t => t.stop()); restore(); recWantStop = false; return; }
      recStream = stream;

      try {
        const ctx = ensureAudio();

      } catch (e) { recAnalyser = null; }

      rec.onerror = () => { notice("Recording stopped", "The microphone was interrupted. What was recorded is kept.", { error: true }); stopRecording(true); };
      // A timeslice keeps data flowing, so a recording is never lost if the stop event is late.
      rec.start(250);

      startRecog();
      recStart = Date.now();
      recHistory = [];
      haptic("press");
      drawWave();
      clearInterval(recTimer);

        const s = (Date.now() - recStart) / 1000;
        $("rectime").textContent = fmtDur(s);
        lastActivity = Date.now();
        if (s * 1000 >= REC_MAX_MS) stopRecording(true);

    } catch (err) {
      if (recStream) { recStream.getTracks().forEach(t => t.stop()); recStream = null; }
      rec = null;
      restore();
      notice("Couldn't start recording", String((err && err.message) || err), { error: true });

  function stopRecording(sendIt) {
    if (startRecording.busy && !rec) { recWantStop = true; return; }
    if (!rec) return;
    const r = rec;
    const stream = recStream;
    const dur = Math.max(1, Math.round((Date.now() - recStart) / 1000));
    const liveText = stopRecog();
    rec = null;
    trackRecording(false);
    cancelAnimationFrame(recRAF);
    clearInterval(recTimer);
    $("recbar").classList.add("hidden"); $("mic").classList.remove("recording");
    $("footer").classList.remove("hidden");
    // Wait for the recorder's final data before deciding what to keep. The old code raced this.
    const finish = () => {
      stream?.getTracks().forEach(t => t.stop());
      if (recStream === stream) recStream = null;
      const chunks = recChunks;
      recChunks = [];
      if (!sendIt) return;
      if (!chunks.length) { notice("Nothing was recorded", "Check the microphone and try again.", { error: true }); return; }
      try {
        pendingLiveText = liveText;
        showHeld(new Blob(chunks, { type: r.mimeType || "audio/webm" }), dur);

      }

    r.addEventListener("stop", finish, { once: true });

  }

  function drawWave() {
    const c = $("wave"), g = c.getContext("2d");
    if (!recAnalyser) { c.classList.add("idle"); return; }
    c.classList.remove("idle");
    const dpr = window.devicePixelRatio || 1;
    const w = c.clientWidth, h = c.clientHeight;
    if (c.width !== Math.floor(w * dpr) || c.height !== Math.floor(h * dpr)) {
      c.width = Math.max(1, Math.floor(w * dpr));
      c.height = Math.max(1, Math.floor(h * dpr));
    }
    const buf = new Uint8Array(recAnalyser.frequencyBinCount);
    const loop = () => {
      if (!rec) return;
      recAnalyser.getByteTimeDomainData(buf);
      let peak = 0;
      for (const v of buf) peak = Math.max(peak, Math.abs(v - 128));
      recHistory.push(peak / 128);
      const cap = Math.floor(w / 4);
      if (recHistory.length > cap) recHistory.splice(0, recHistory.length - cap);
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, w, h);
      g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#9a5a48";
      recHistory.forEach((a, i) => {
        const bh = Math.min(h, Math.max(3, a * h * 1.6));
        g.globalAlpha = 0.35 + 0.65 * (i / recHistory.length);
        g.fillRect(i * 4, (h - bh) / 2, 2, bh);
      });
      g.globalAlpha = 1;
      recRAF = requestAnimationFrame(loop);
    };
    loop();
  }

  async function mediaURL(id) {

    if (cached) return cached;

      if (String(id).startsWith("local-")) {

  async function sendPlainText(text, opts) {

    if (!text) return false;
    const client = cloudClient();
    const clientId = uid();
    const fwd = opts && opts.fwd ? { fwd: true, from: opts.fwd.from || null } : null;
    const local = addMessage({ kind: "text", text, effect: "none", replyTo: fwd, clientId });
    render();

      const box = outbox();
      box.push({ kind: "text", text, effect: "none", replyTo: fwd, clientId, localId: local.id });
      saveOutbox(box);
      return true;
    }
    const ins = await client.from("messages").insert({ pair_id: pairId, sender_id: myUserId, kind: "text", text, effect: "none", client_id: clientId, quiet: !!(opts && opts.quiet), reply_to: fwd }).select().maybeSingle();
    if (ins.error) {
      markFailed(local.id);
