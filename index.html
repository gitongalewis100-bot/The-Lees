<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Notes</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Lees">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<style>
:root{
  --bg:#f8f4ee;--surface:#fffdf9;--ink:#2a2420;--muted:#8c8179;--line:#ebe2d7;--line-strong:#dcd0c2;
  --mine:#e8d5bf;--mine-ink:#2a2420;--theirs:#ffffff;--accent:#9a5a48;--accent-ink:#fff;
  --lilac:#7d6a9b;--sage:#6f8f7a;--rose:#b5534a;
  --shadow:0 1px 2px rgba(42,36,32,.06),0 8px 24px rgba(42,36,32,.06);
  --ease:cubic-bezier(.2,.8,.2,1);
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
[data-theme="ink"]{--bg:#171412;--surface:#211d1a;--ink:#f1ebe4;--muted:#948a82;--line:#342e29;--line-strong:#4a413a;--mine:#3f342c;--mine-ink:#f1ebe4;--theirs:#262120;--accent:#d69a84;--accent-ink:#1d1a18;--lilac:#b5a3d6;--sage:#9cc2aa;--rose:#e08b80;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}
[data-theme="sage"]{--bg:#eef3ee;--surface:#fbfdfb;--ink:#1f2b24;--muted:#6f8577;--line:#dbe5dc;--line-strong:#c4d3c6;--mine:#cfe3d3;--mine-ink:#1f2b24;--theirs:#fff;--accent:#4f7a5e;--accent-ink:#fff;--lilac:#6d7fa0;--sage:#4f7a5e;--rose:#b5534a}
[data-theme="rose"]{--bg:#faf1f2;--surface:#fffafa;--ink:#3a2327;--muted:#8f6b71;--line:#f0dfe1;--line-strong:#e2c9cc;--mine:#f3d3d8;--mine-ink:#3a2327;--theirs:#fff;--accent:#b04a63;--accent-ink:#fff;--lilac:#9a6b8f;--sage:#b5788a;--rose:#b04a63}
[data-theme="cream"]{--bg:#fbf8ef;--surface:#fffef9;--ink:#33301f;--muted:#8a8462;--line:#eee9d4;--line-strong:#ddd5b4;--mine:#f0e6b8;--mine-ink:#33301f;--theirs:#fff;--accent:#8a7417;--accent-ink:#fff;--lilac:#8a7417;--sage:#6f8f4a;--rose:#a5523e}
[data-theme="glass"]{--bg:#0d1020;--surface:#161b30;--ink:#e8ecfa;--muted:#8389a8;--line:#262d4a;--line-strong:#363f63;--mine:#2a3266;--mine-ink:#eef1ff;--theirs:#1a2038;--accent:#7cc6ff;--accent-ink:#0a0f20;--lilac:#9d8cff;--sage:#6fd6b0;--rose:#ff8fa6}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:var(--vh,100dvh);overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;transition:background .6s var(--ease),color .6s var(--ease),filter .3s var(--ease);-webkit-touch-callout:none}
body.private{filter:blur(22px) saturate(.6)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
.hidden{display:none!important}
.i{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.sm{width:16px;height:16px}
.mono{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase}
.serif{font-family:var(--serif)}
.muted{color:var(--muted)}
.hdr{font-family:var(--serif);font-size:20px;letter-spacing:.01em;margin:0}

/* ---------- Sign-in ---------- */
#lock{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px;gap:10px;overflow-y:auto;animation:rise .5s var(--ease) both}
.mark{width:58px;height:58px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--accent);margin-bottom:4px;animation:float 6s ease-in-out infinite}
.mark .i{width:26px;height:26px}
#lock h1{font-family:var(--serif);font-weight:normal;font-size:26px;margin:0}
#tagline{font-family:var(--serif);font-style:italic;color:var(--accent);font-size:16px;min-height:1.6em;margin:0;text-align:center}
#tagline::after{content:"▍";margin-left:2px;opacity:.7;animation:blink 1s steps(1) infinite}
#tagline.done::after{opacity:0}
#tagline.done{animation:breathe 4.5s ease-in-out infinite}
.wholine{display:none;color:var(--muted);font-size:14px;margin:6px 0 0}
#notYou{display:none;color:var(--accent);font-size:13px;text-decoration:underline;text-underline-offset:3px}
#lock .sub{color:var(--muted);margin:0;font-size:14px}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(320px,100%)}
.side{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:border-color .2s,transform .2s var(--ease),background .2s}
.side:active{transform:scale(.98)}
.side .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--serif);font-size:17px}
.side .av.lewis{background:var(--lilac)}
.side .av.agnes{background:var(--sage)}
.side b{font-weight:normal;font-family:var(--serif);font-size:15px}
.side small{color:var(--muted);font-size:12px}
.side[aria-pressed="true"]{border-color:var(--accent);background:var(--mine)}
#lock.remembered .sides,#lock.remembered .sub{display:none}
#lock.remembered .wholine{display:block}
#lock.remembered #notYou{display:inline-block}
.form{display:none;flex-direction:column;gap:10px;width:min(320px,100%)}
.form.on{display:flex}
.field{position:relative}
.in{width:100%;padding:13px 46px 13px 15px;border:1px solid var(--line);border-radius:14px;background:var(--surface);outline:none;transition:border-color .2s;font-size:15px}
.in.plain{padding-right:15px}
.in:focus{border-color:var(--accent)}
select.in{padding-right:12px}
#peek{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:grid;place-items:center;color:var(--muted);border-radius:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-size:15px;transition:transform .15s var(--ease),opacity .2s}
.btn:active{transform:scale(.98)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--rose);border:1px solid var(--rose)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.link{color:var(--accent);font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--rose)}
#lockErr{color:var(--rose);min-height:1.2em;font-size:13.5px;text-align:center}
.shake{animation:shake .4s}

/* ---------- Views ---------- */
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px);animation:fade .35s var(--ease) both}
.topbar{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface);min-height:58px}
.topbar .grow{flex:1;min-width:0}
.topbar .title{font-family:var(--serif);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none;transition:color .2s,background .2s}
.ibtn:hover{color:var(--ink);background:var(--bg)}
.ibtn.on{color:var(--accent)}
.ibtn.danger{color:var(--rose)}
.avatar{width:36px;height:36px;aspect-ratio:1/1;overflow:hidden;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--serif);font-size:15px;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover;aspect-ratio:1/1;display:block}
.avatar.lewis{background:var(--lilac)}
.avatar.agnes{background:var(--sage)}

/* Home (journal) */
#home .scroll{flex:1;overflow-y:auto;padding:18px 16px 40px}
.greet{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:2px 2px 16px}
.greet .hdr{font-size:clamp(28px,8vw,40px);letter-spacing:-.02em;line-height:1.05}
.greet .mono{margin-top:6px;color:var(--muted)}
.journal-btn{width:48px;height:48px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--accent)}
.navrow{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0 8px}
.homegrid{display:grid;grid-template-columns:1.55fr 1fr;gap:8px;align-items:stretch}
.navbtn.settings-box{width:100%;height:100%;min-height:168px;flex-direction:column;align-items:flex-start;justify-content:center;font-size:16px;padding:18px 16px;gap:10px}
.tools2{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
.tools2 .navbtn{width:100%}
.navbtn{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:16px;background:color-mix(in srgb,var(--surface) 86%,transparent);border:1px solid var(--line);white-space:nowrap;font-size:13px;color:var(--ink);flex:none;box-shadow:var(--shadow)}
.navbtn.on{border-color:var(--accent);color:var(--accent)}
.navbtn.danger{color:var(--rose)}
.person.hero{width:100%;padding:18px 16px;border-radius:28px;background:linear-gradient(165deg,color-mix(in srgb,var(--surface) 88%,var(--accent)),var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));box-shadow:var(--shadow);transform-style:preserve-3d}
.person.hero .avatar{width:52px;height:52px;font-size:20px}
.person.hero .n{font-size:22px}
.person.hero .s{font-size:13px;margin-top:2px}
.lift{transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.lift:active{transform:scale(.975)}
@media (hover:hover) and (pointer:fine){
  .lift:hover{transform:translateY(-8px) rotate3d(1,-1,0,5deg);box-shadow:0 16px 36px rgba(154,90,72,.18),0 0 0 1px rgba(214,154,132,.4),0 0 28px rgba(154,90,72,.16)}
}
@media (prefers-reduced-motion: reduce){
  .lift,.lift:hover,.lift:active{transform:none!important;box-shadow:var(--shadow)!important}
}
.pinbar{align-self:stretch;text-align:left;margin:0 0 8px;padding:8px 12px;border-radius:14px;background:color-mix(in srgb,var(--accent) 12%,var(--surface));border:1px solid var(--line);color:var(--ink);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reacts{display:flex;gap:6px;padding:2px 4px 8px}
.reacts .act{min-width:44px;font-size:20px;padding:6px 8px}
.sec-label{display:flex;justify-content:space-between;align-items:baseline;margin:20px 2px 10px;color:var(--muted)}
.tray{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.tray::-webkit-scrollbar{display:none}
.tcard{display:flex;flex-direction:column;align-items:center;gap:6px;width:92px;flex:none}
.bubble{position:relative;max-width:92px;min-height:30px;padding:6px 9px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:11.5px;line-height:1.3;color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;box-shadow:var(--shadow)}
.bubble::after{content:"";position:absolute;bottom:-5px;left:50%;margin-left:-4px;width:8px;height:8px;background:var(--surface);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.bubble.empty{color:var(--muted);font-style:italic}
.ring{width:62px;height:62px;border-radius:50%;padding:2px;background:linear-gradient(135deg,var(--accent),var(--lilac));display:grid;place-items:center}
.ring.seen{background:var(--line-strong)}
.ring .avatar{width:56px;height:56px;border:2px solid var(--bg);font-size:19px}
.tcard .nm{font-size:12px;color:var(--muted)}
.people{display:flex;flex-direction:column;gap:10px}
.person{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-align:left;box-shadow:var(--shadow);transition:transform .15s var(--ease)}
.person:active{transform:scale(.99)}
.person .grow{flex:1;min-width:0}
.person .n{font-family:var(--serif);font-size:16px}
.person .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px}
.note-card{padding:14px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:10px}
.note-card .top{display:flex;align-items:center;gap:8px;color:var(--muted);margin-bottom:8px}
.note-card .txt{font-family:var(--serif);font-size:16px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.kind{padding:3px 9px;border-radius:999px;border:1px solid var(--line-strong);font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.seen{margin-left:auto;color:var(--muted)}

/* Chat */
#chat{display:flex;flex-direction:column}
#presence{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#presence.live{color:var(--accent)}
.shieldon{color:var(--accent)!important}
#chips{display:flex;gap:8px;padding:8px 14px 0;overflow-x:auto;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;color:var(--muted);white-space:nowrap;flex:none}
.chip.on{color:var(--accent);border-color:var(--accent)}

#searchbar{display:flex;flex-direction:column;gap:8px;margin:10px 14px 0;padding:10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
#searchrow{display:flex;align-items:center;gap:8px}
#searchrow input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:15px}
#qcount{color:var(--muted);white-space:nowrap;font-family:var(--mono);font-size:11px}
#filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#filters .chip{font-size:12px;padding:4px 10px}
#filters input[type=date]{font-size:12px;padding:4px 8px;border-radius:999px;border:1px solid var(--line);background:var(--bg);outline:none}
mark{background:rgba(214,154,132,.45);color:inherit;border-radius:4px;padding:0 2px}
.hit{outline:2px solid var(--accent);outline-offset:4px;border-radius:20px}

#list{flex:1;overflow-y:auto;overflow-anchor:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:14px 14px 10px;display:flex;flex-direction:column;gap:4px}
#list .text,#list .photo{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.day{align-self:center;color:var(--muted);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;margin:12px 0 8px;padding:4px 12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;text-transform:uppercase}
.newline{align-self:stretch;display:flex;align-items:center;gap:10px;color:var(--accent);margin:12px 0 8px}
.newline::before,.newline::after{content:"";flex:1;height:1px;background:var(--accent);opacity:.35}
.row{display:flex;flex-direction:column;max-width:80%;margin-bottom:4px}
.row.fresh{opacity:0}
.row.fresh.in{opacity:1;transition:opacity .2s var(--ease)}
.row.mine{align-self:flex-end;align-items:flex-end}
.row.theirs{align-self:flex-start;align-items:flex-start}
.row.glow .msg{animation:glow 2s var(--ease)}
.msg{position:relative;padding:10px 14px 8px;border-radius:18px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:var(--shadow);-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.mine .msg{background:var(--mine);color:var(--mine-ink);border-bottom-right-radius:6px}
.theirs .msg{background:var(--theirs);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.flash{animation:flash 1.3s var(--ease)}
.msg.pressing{transform:scale(.985)}
.msg.gone{background:transparent;box-shadow:none;border:1px dashed var(--line-strong);color:var(--muted);font-style:italic}
.msg.blurred .text,.msg.blurred .photo{filter:blur(9px);opacity:.75}
.msg.blurred .text{font-style:italic}
.msg.revealed .text,.msg.revealed .photo{filter:none;opacity:1}
.msg.blurred .voice{filter:blur(6px);opacity:.6}
.quote{display:flex;flex-direction:column;gap:1px;padding:6px 10px;margin-bottom:6px;border-left:2px solid var(--accent);border-radius:8px;background:rgba(154,90,72,.08);font-size:12.5px;color:var(--muted)}
.quote b{font-weight:normal;color:var(--accent);font-size:11.5px}
.quote span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photo{display:block;width:100%;height:100%;object-fit:cover;border-radius:12px;cursor:zoom-in;background:var(--line)}
.phframe{width:min(250px,68vw);aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--line)}
.stack{display:flex;align-items:center;gap:8px;margin-top:3px;color:var(--muted);padding:0 4px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px}
.heart{color:var(--accent);display:inline-flex;align-items:center;gap:3px}
.heartbtn{position:relative;width:28px;height:28px;display:inline-grid;place-items:center;color:var(--muted)}
.heartbtn svg{fill:none;stroke:currentColor}
.heartbtn.on{color:#e0245e}
.heartbtn.on svg{fill:#e0245e;stroke:#e0245e}
.heartbtn.pop svg{animation:heartpop .55s var(--ease)}
.heartbtn.shrink svg{animation:heartshrink .28s var(--ease)}
.heartcount{font-size:12px;color:var(--muted);min-width:1ch}
.emojicount{font-size:13px}
.igheart{position:absolute;left:50%;top:42%;z-index:3;font-size:64px;color:#e0245e;pointer-events:none;animation:igheart .7s var(--ease) forwards}
.bits{position:absolute;width:6px;height:6px;border-radius:50%;background:#e0245e;pointer-events:none;animation:bit .55s ease-out forwards}
@keyframes heartpop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes heartshrink{0%{transform:scale(1)}100%{transform:scale(.75)}}
@keyframes igheart{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}35%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.4)}}
@keyframes bit{to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}
.row.fresh.in{opacity:1}
.scratch{position:absolute;inset:0;z-index:2;width:100%;height:100%;border-radius:inherit;touch-action:none;cursor:crosshair;transition:opacity .9s ease}
.scratch.gone{opacity:0;pointer-events:none}
.msg.reblur .text,.msg.reblur .photo,.msg.reblur .voice{filter:blur(9px);transition:filter .45s ease}
.msg.shimmer::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shim .6s ease;pointer-events:none}
@keyframes shim{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.caldow{text-align:center;font-size:11px;color:var(--muted)}
.calday{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.calday.on{border-color:var(--accent);color:var(--accent)}
.calnav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
@media (prefers-reduced-motion: reduce){
  .row.fresh,.row.fresh.in,.heartbtn.pop svg,.heartbtn.shrink svg,.igheart,.bits,.msg.shimmer::after{animation:none!important;transition:none!important;opacity:1;transform:none}
}
.edlabel{color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.receipt{margin-top:3px;color:var(--muted);padding-right:4px;font-family:var(--mono);font-size:10px;letter-spacing:.06em}
.empty{margin:auto;text-align:center;color:var(--muted);font-size:14px;line-height:1.7;padding:24px}
.empty b{display:block;color:var(--ink);font-family:var(--serif);font-weight:normal;font-size:17px;margin-bottom:4px}
.voice{display:flex;align-items:center;gap:10px;min-width:230px;transition:filter .3s}
.vplay{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.vplay .i{width:15px;height:15px;fill:currentColor;stroke:none}
.bars{display:flex;align-items:center;gap:2px;flex:1;height:32px;cursor:pointer}
.bars i{flex:1;background:var(--muted);opacity:.4;border-radius:2px;min-width:2px;transition:background .15s,opacity .15s}
.bars i.on{background:var(--accent);opacity:1}
.vt{min-width:34px;text-align:right;color:var(--muted)}
.vspeed{padding:3px 6px;border-radius:7px;border:1px solid var(--line);color:var(--muted);font-family:var(--mono);font-size:10px}
#typing{height:20px;padding:0 18px;font-size:12px;color:var(--muted);font-style:italic;opacity:0;transition:opacity .25s}
#typing.show{opacity:1}

/* Thin banners */
.bar{position:fixed;left:10px;right:10px;z-index:45;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.18);animation:up .3s var(--ease) both;padding:6px}
#actionBar{bottom:calc(74px + env(safe-area-inset-bottom,0px))}
#actionBar .acts{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
#actionBar .acts::-webkit-scrollbar{display:none}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:58px;padding:8px 6px;border-radius:12px;color:var(--ink);font-size:11px;flex:none}
.act:hover{background:var(--bg)}
.act.danger{color:var(--rose)}
.vmenu{position:fixed;z-index:46;min-width:220px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column}
.vmenu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px;border-radius:12px;font-size:15px;color:var(--ink)}
.vmenu button.danger{color:var(--rose)}
.vmenu button:active{background:var(--bg)}
.vmenu hr{border:0;border-top:1px solid var(--line);margin:4px 8px}
.vmenu .react-row{display:none;justify-content:space-between;padding:4px 6px 8px}
.vmenu .react-row.open{display:flex}
.vmenu .react-row button{width:44px;height:44px;justify-content:center;font-size:22px;padding:0}
.fx2{position:fixed;pointer-events:none;z-index:50}
.effectchip{padding:2px 16px 0;font-size:13px;color:var(--muted);min-height:18px}
.effectchip:empty{display:none;min-height:0;padding:0}
.schedprev{display:flex;justify-content:flex-end;margin:0 0 10px}
#themeBar{top:calc(env(safe-area-inset-top,0px) + 66px)}
#themeBar .acts{display:flex;gap:8px;overflow-x:auto;padding:4px;scrollbar-width:none}
#themeBar .acts::-webkit-scrollbar{display:none}
.tchip{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;flex:none;white-space:nowrap}
.tchip.on{border-color:var(--accent)}
.swatch{width:20px;height:20px;border-radius:50%;border:1px solid var(--line-strong);flex:none}

/* Notices (structured system messages) */
#notice{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:80;display:flex;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.16);animation:up .35s var(--ease) both}
#notice .rule{width:3px;border-radius:3px;background:var(--accent);flex:none}
#notice.err .rule{background:var(--rose)}
#notice .body{flex:1;min-width:0}
#notice .t{font-family:var(--serif);font-size:15px;margin:0 0 2px}
#notice .d{font-size:13px;color:var(--muted);line-height:1.45;margin:0}
#notice .acts{display:flex;gap:8px;margin-top:8px}
#notice .x{align-self:flex-start;color:var(--muted);width:26px;height:26px;display:grid;place-items:center;border-radius:8px}

/* Composer */
footer{display:flex;align-items:flex-end;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.tool{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.tool:hover{color:var(--ink);background:var(--bg)}
#input{flex:1;resize:none;min-height:42px;max-height:128px;padding:10px 14px;border:1px solid var(--line);border-radius:21px;background:var(--bg);outline:none;line-height:1.35;font-size:15px;transition:border-color .2s}
#input:focus{border-color:var(--accent)}
#send{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;transition:transform .15s var(--ease),opacity .2s}
#mic,#send{touch-action:manipulation}
#send:active{transform:scale(.92)}
#send:disabled{opacity:.35}
#recbar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface);border-top:1px solid var(--line)}
#recbar .dot{width:9px;height:9px;border-radius:50%;background:var(--rose);animation:pulse 1s infinite;flex:none}
#rectime{min-width:40px}
#wave{flex:1;height:40px;min-width:0;width:100%}
#toBottom{position:absolute;right:16px;bottom:84px;padding:8px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line-strong);box-shadow:var(--shadow);font-size:12.5px;display:flex;gap:6px;align-items:center;z-index:20}

/* Panels (full-screen) */
.panel-body{flex:1;overflow-y:auto;padding:16px 16px 40px}
.pgroup{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.prow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.prow:last-child{border-bottom:0}
.prow .lab{display:flex;flex-direction:column;gap:2px;min-width:0}
.prow .lab small{color:var(--muted);font-size:12px}
.prow .in{width:auto;max-width:55%;padding:8px 10px;font-size:14px}
.gh{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 4px 8px}
.sw{position:relative;width:42px;height:24px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--line-strong);transition:background .25s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .3s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked + span{background:var(--accent)}
.sw input:checked + span::after{transform:translateX(18px)}
.wchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.wchips span{padding:4px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:12px;display:inline-flex;gap:6px;align-items:center}
.wchips button{color:var(--muted);display:grid;place-items:center}
.wchips .i{width:12px;height:12px}
.note-compose{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.note-compose textarea{width:100%;min-height:140px;resize:none;border:0;outline:none;background:none;font-family:var(--serif);font-size:17px;line-height:1.5}
.kinds{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.kinds .chip{cursor:pointer}
.count{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-align:right}
.item{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.item:last-child{border-bottom:0}
.item .txt{flex:1;min-width:0}
.item .txt span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.item .txt small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.item img{width:52px;height:52px;border-radius:10px;object-fit:cover}
.reading{font-family:var(--serif);font-size:18px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.reading-card{padding:20px 4px 22px;border-bottom:1px solid var(--line)}
.reading-card .meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;gap:8px;align-items:center}

/* Sheets (structured forms) */
#sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
#sheet .scrim{position:absolute;inset:0;background:rgba(10,8,7,.42);animation:fade .25s both}
#sheetBody{position:relative;width:min(540px,100%);max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.2);animation:up .35s var(--ease) both;border-top:1px solid var(--line)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line-strong);margin:4px auto 14px}
.fp-title{font-family:var(--serif);font-size:21px;margin:0 0 6px}
.fp-desc{color:var(--muted);font-size:13.5px;line-height:1.5;margin:0 0 14px}
.fp-field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.fp-field label{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.fp-err{color:var(--rose);font-size:13px;min-height:1.2em;margin:4px 0 8px}
.fp-acts{display:flex;gap:8px;margin-top:8px}
.fp-acts .btn{flex:1}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--bg);text-align:left;margin-bottom:8px}
.choice b{font-weight:normal;font-family:var(--serif);font-size:15.5px}
.choice small{color:var(--muted);font-size:12.5px;line-height:1.4}
.choice.danger b{color:var(--rose)}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes blink{50%{opacity:0}}
@keyframes breathe{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(154,90,72,.5)}100%{box-shadow:0 0 0 14px rgba(154,90,72,0)}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(214,154,132,.8)}100%{box-shadow:0 0 0 18px rgba(214,154,132,0)}}
@keyframes fxrise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-110vh) rotate(25deg) scale(1.1);opacity:0}}
.fx{position:fixed;bottom:-30px;z-index:95;pointer-events:none;color:var(--accent);animation:fxrise 2.2s ease-out forwards}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- Sign-in -->
<section id="lock" style="position:absolute;inset:0">
  <div class="mark"><svg class="i" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg></div>
  <h1>Notes</h1>
  <p id="tagline" aria-live="polite"></p>
  <p class="wholine" id="whoLine"></p>
  <button id="notYou" type="button">Not you? Switch side</button>
  <p class="sub">Who are you signing in as?</p>
  <div class="sides" role="group" aria-label="Sign in as">
    <button class="side" data-side="Lewis" aria-pressed="false"><span class="av avatar lewis">L</span><b>Mr Lees</b></button>
    <button class="side" data-side="Agnes" aria-pressed="false"><span class="av avatar agnes">A</span><b>Mrs Lees</b></button>
  </div>

  <form id="lockForm" class="form" autocomplete="off">
    <div class="field">
      <input id="pass" class="in" type="password" placeholder="Your passphrase" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Passphrase">
      <button id="peek" type="button" aria-label="Show passphrase"><svg class="i sm" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <button class="btn" type="submit">Open</button>
    <button id="forgot" class="link hidden" type="button" style="align-self:center">Forgot passphrase?</button>
  </form>

  <form id="setupForm" class="form" autocomplete="off">
    <p class="fp-desc" style="margin:0">First time on this side. Create your passphrase and two recovery questions. Only you know the answers.</p>
    <div style="position:relative"><input id="sp1" class="in plain" type="password" placeholder="New passphrase (4+ characters)" autocapitalize="none" spellcheck="false"><button id="peek1" type="button" aria-label="Show passphrase" style="position:absolute;right:8px;top:50%;transform:translateY(-50%)"><svg class="i sm" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <div style="position:relative"><input id="sp2" class="in plain" type="password" placeholder="Repeat passphrase" autocapitalize="none" spellcheck="false"><button id="peek2" type="button" aria-label="Show passphrase" style="position:absolute;right:8px;top:50%;transform:translateY(-50%)"><svg class="i sm" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <select id="sq1" class="in"></select>
    <input id="sa1" class="in plain" placeholder="Answer" autocapitalize="none" spellcheck="false">
    <select id="sq2" class="in"></select>
    <input id="sa2" class="in plain" placeholder="Answer" autocapitalize="none" spellcheck="false">
    <button class="btn" type="submit">Create and open</button>
  </form>

  <form id="recoverForm" class="form" autocomplete="off">
    <p class="fp-desc" style="margin:0">Answer both recovery questions to set a new passphrase.</p>
    <label class="mono muted" id="rq1l"></label>
    <input id="ra1" class="in plain" placeholder="Answer" autocapitalize="none" spellcheck="false">
    <label class="mono muted" id="rq2l"></label>
    <input id="ra2" class="in plain" placeholder="Answer" autocapitalize="none" spellcheck="false">
    <div style="position:relative"><input id="rp1" class="in plain" type="password" placeholder="New passphrase (4+ characters)" autocapitalize="none" spellcheck="false"><button id="peek3" type="button" aria-label="Show passphrase" style="position:absolute;right:8px;top:50%;transform:translateY(-50%)"><svg class="i sm" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <button class="btn" type="submit">Set new passphrase</button>
    <button id="recCancelBtn" class="link" type="button" style="align-self:center">Back</button>
  </form>
  <div id="lockErr" role="alert"></div>
</section>

<!-- Journal home -->
<section id="home" class="view hidden">
  <div class="topbar">
    <div class="avatar" id="homeAvatar"></div>
    <div class="grow"><div class="title" id="homeTitle">Journal</div><div class="sub" id="homeSub"></div></div>
  </div>
  <div class="scroll">
    <div class="greet">
      <div><div class="hdr" id="greet"></div><div class="mono" id="dateLine"></div></div>
    </div>
    <nav class="navrow" id="navrow" aria-label="Sections"></nav>

    <div class="sec-label mono hidden" id="trayLabel"><span>Notes</span><span id="trayHint"></span></div>
    <div class="tray hidden" id="tray"></div>

    <div id="people"></div>

    <div class="sec-label mono hidden" id="feedLabel"><span>Journal</span><span id="feedCount"></span></div>
    <div id="feed" class="hidden"></div>
  </div>
</section>

<!-- Chat -->
<section id="chat" class="view hidden">
  <div class="topbar">
    <button id="back" class="ibtn" aria-label="Back to journal (Esc)" title="Back (Esc)"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="avatar" id="chatAvatar"></div>
    <div class="grow"><div class="title" id="chatTitle"></div><div id="presence" class="sub">private</div></div>
    <button id="searchBtn" class="ibtn" aria-label="Search (/)" title="Search (/)"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
    <button id="shieldBtn" class="ibtn" aria-label="Blur the whole conversation" title="Shield"><svg class="i" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></button>
  </div>
  <div id="chips"></div>
  <div id="searchbar" class="hidden">
    <div id="searchrow">
      <input id="q" placeholder="Search this conversation" autocomplete="off" aria-label="Search">
      <span id="qcount"></span>
      <button id="qPrev" class="ibtn" aria-label="Previous match" style="width:30px;height:30px"><svg class="i sm" viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg></button>
      <button id="qNext" class="ibtn" aria-label="Next match" style="width:30px;height:30px"><svg class="i sm" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <button id="qClose" class="ibtn" aria-label="Close search" style="width:30px;height:30px"><svg class="i sm" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div id="filters">
      <button class="chip on" data-f="all">All</button>
      <button class="chip" data-f="photo">Photos</button>
      <button class="chip" data-f="voice">Voice</button>
      <input id="fdate" type="date" aria-label="On date">
    </div>
  </div>
  <div id="list" aria-live="polite"></div>
  <div id="typing"></div>
  <button id="toBottom" class="hidden">Latest</button>
  <div id="effectChip" class="effectchip"></div>
  <div id="replyBar" class="hidden" style="display:none;align-items:center;gap:10px;margin:0 12px;padding:8px 12px;border-radius:14px 14px 0 0;background:var(--surface);border:1px solid var(--line);border-bottom:0;font-size:13px">
    <span id="replyLabel" class="mono" style="color:var(--accent)"></span>
    <span id="replyText" style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)"></span>
    <button id="replyX" class="ibtn" aria-label="Cancel" style="width:28px;height:28px"><svg class="i sm" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  </div>
  <div id="recbar" class="hidden">
    <span class="dot"></span>
    <span id="rectime" class="mono">0:00</span>
    <canvas id="wave"></canvas>
    <button id="recCancel" class="btn ghost sm">Cancel</button>
    <button id="recSend" class="btn sm">Send</button>
  </div>
  <footer id="footer">
    <button id="attach" class="tool" aria-label="Attach photos or audio"><svg class="i" viewBox="0 0 24 24"><path d="M21 11.5l-8.5 8.5a5 5 0 0 1-7-7L14 4.5a3.5 3.5 0 0 1 5 5L10.5 18a2 2 0 0 1-3-3L16 6.5"/></svg></button>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <button id="mic" class="tool" aria-label="Record voice note"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button id="clock" class="tool" aria-label="Send later"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
    <textarea id="input" rows="1" placeholder="Write something…" aria-label="Message"></textarea>
    <button id="send" type="button" aria-label="Send"><svg class="i" viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
  </footer>
  <div id="actionBar" class="bar hidden"><div class="acts" id="acts"></div></div>
  <div id="vmenu" class="vmenu hidden"></div>
</section>

<!-- Full-screen panels: Notes reading, Notes composer, Settings, Moments, Archive, Scheduled -->
<section id="panel" class="view hidden">
  <div class="topbar">
    <button id="panelBack" class="ibtn" aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="grow"><div class="title" id="panelTitle"></div><div class="sub" id="panelSub"></div></div>
    <div id="panelRight"></div>
  </div>
  <div class="panel-body" id="panelBody"></div>
</section>

<div id="themeBar" class="bar hidden"><div class="acts" id="themeActs"></div></div>
<div id="menuDummy"></div>
<div id="sheet" class="hidden"><div class="scrim" id="sheetScrim"></div><div id="sheetBody"></div></div>
<div id="notice" class="hidden"></div>

  /* ================= Media (IndexedDB) ================= */
  let dbP = null;
  function db() {
    if (!dbP) dbP = new Promise((res, rej) => {
      const r = indexedDB.open("pp-media", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("blobs");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbP;

  async function putBlob(id, blob) {
    const d = await db();
    return new Promise((res, rej) => { const t = d.transaction("blobs", "readwrite"); t.objectStore("blobs").put(blob, id); t.oncomplete = () => res(); t.onerror = () => rej(t.error); });
  }
  async function getBlob(id) {
    const d = await db();
    return new Promise((res, rej) => { const q = d.transaction("blobs").objectStore("blobs").get(id); q.onsuccess = () => res(q.result || null); q.onerror = () => rej(q.error); });
  }
  async function delBlob(id) {
    const d = await db();

  }

    const btn = el("button", "vplay");
    btn.innerHTML = ic("play");
    const bars = el("div", "bars");
    const N = 34, seed = hash(m.id);
    for (let i = 0; i < N; i++) {
      const b = el("i");
      b.style.height = (8 + (((seed * (i + 7) * 2654435761) >>> 0) % 20)) + "px";
      bars.appendChild(b);
    }
    const time = el("span", "vt mono", fmtDur(m.dur || 0));
    const speed = el("button", "vspeed", "1×");
    let rate = 1;
    wrap.append(btn, bars, time, speed);
    wrap._audio = audio;
    const dur = () => (isFinite(audio.duration) && audio.duration > 0 ? audio.duration : (m.dur || 0));
    const update = () => {
      const d = dur();
      const n = d ? Math.floor((audio.currentTime / d) * N) : 0;
      [...bars.children].forEach((b, i) => b.classList.toggle("on", i < n));
      time.textContent = fmtDur(audio.paused && audio.currentTime === 0 ? d : audio.currentTime);

      e.stopPropagation();

        });

    audio.addEventListener("play", () => { btn.innerHTML = ic("pause"); });
    audio.addEventListener("pause", () => { btn.innerHTML = ic("play"); update(); });
    audio.addEventListener("ended", () => { btn.innerHTML = ic("play"); audio.currentTime = 0; update(); });
    audio.addEventListener("timeupdate", update);
    audio.addEventListener("loadedmetadata", update);
    speed.addEventListener("click", (e) => { e.stopPropagation(); rate = rate === 1 ? 1.5 : rate === 1.5 ? 2 : 1; audio.playbackRate = rate; speed.textContent = rate + "×"; });
    bars.addEventListener("click", (e) => {
      e.stopPropagation();

  let unreadN = 0, focusDay = null, chatDay = null, justHeart = null, calCursor = new Date();

  function attachScratch(card, text) {
    const canvas = el("canvas", "scratch");
    card.appendChild(canvas);
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    let w = 0, h = 0, down = false, last = null, drew = false, revealed = false, timer = null, sampler = null;
    function paintCover() {
      ctx.globalCompositeOperation = "source-over";
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, w, h);
      const g = ctx.createLinearGradient(0, 0, w, h);
      g.addColorStop(0, "#dcc7cf");
      g.addColorStop(1, "#c9aab7");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    }
    function size() {
      const r = card.getBoundingClientRect();
      w = Math.max(1, Math.round(r.width * dpr));
      h = Math.max(1, Math.round(r.height * dpr));
      canvas.width = w;
      canvas.height = h;
      paintCover();
    }
    function clearedShare() {
      if (!w || !h) return 0;
      const d = ctx.getImageData(0, 0, w, h).data;
      let clear = 0, total = 0;
      for (let i = 3; i < d.length; i += 36) { total++; if (d[i] < 16) clear++; }
      return total ? clear / total : 0;
    }
    function revealAll() {
      if (revealed) return;
      revealed = true;
      canvas.classList.add("gone");
      stopSampler();
    }
    function startSampler() { if (!sampler) sampler = setInterval(() => { if (clearedShare() >= 0.6) revealAll(); }, 220); }
    function stopSampler() { clearInterval(sampler); sampler = null; }
    function reblur() {
      card.classList.remove("shimmer");
      canvas.classList.add("gone");
      paintCover();
      revealed = false;
      drew = false;
      requestAnimationFrame(() => requestAnimationFrame(() => canvas.classList.remove("gone")));
    }
    function startCountdown() {
      clearTimeout(timer);
      timer = setTimeout(reblur, revealMs(text));

    const pos = (e) => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    function stroke(a, b) {
      ctx.globalCompositeOperation = "destination-out";
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "rgba(0,0,0,1)";
      ctx.lineWidth = 16 * dpr;
      ctx.beginPath();

      ctx.lineTo(b.x * dpr, b.y * dpr);

      if (!down) return;
      down = false;
      stopSampler();
      if (clearedShare() >= 0.6) revealAll();

    canvas.addEventListener("pointercancel", lift);

  }
  function chromeRev(m, seen, isLastMine) {
    const seenAt = isLastMine ? (seen[other()] || 0) : 0;
    return [(m.hearts || []).join(","), m.edited ? 1 : 0, m.pending ? 1 : 0, m.moment ? 1 : 0, m.late ? 1 : 0, isLastMine ? 1 : 0, seenAt >= m.ts ? seenAt : 0].join("\u0001");
  }
  function paintChrome(row, m, seen, isLastMine) {
    const hb = row.querySelector(".heartbtn");
    if (hb) {
      const on = likedByMe(m);
      hb.classList.toggle("on", on);
      hb.setAttribute("aria-label", on ? "Unlike" : "Like");
      if (justHeart && justHeart.id === m.id) {
        if (!reduceMotion()) hb.classList.add(justHeart.on ? "pop" : "shrink");
        if (justHeart.on) { burstHeart(hb); popSound(); }
        justHeart = null;
      }
    }
    const hc = row.querySelector(".heartcount");
    if (hc) hc.textContent = String(heartCount(m));
    row.querySelectorAll(".emojicount").forEach(n => n.remove());
    const meta = row.querySelector(".stack");
    if (meta) {
      for (const [emo, n] of Object.entries(emojiCounts(m))) meta.appendChild(el("span", "emojicount", emo + " " + n));
      const pend = row.querySelector("[data-pend]");
      if (m.pending && !pend) { const s = el("span", "", "· waiting to send"); s.dataset.pend = "1"; meta.appendChild(s); }
      if (!m.pending && pend) pend.remove();
      const mom = row.querySelector("[data-mom]");
      if (m.moment && !mom) { const s = el("span", "", "· moment"); s.dataset.mom = "1"; meta.appendChild(s); }
      if (!m.moment && mom) mom.remove();
    }
    let receipt = row.querySelector(".receipt");
    if (isLastMine) {
      const s = seen[other()] || 0;
      const text = s >= m.ts ? "SEEN " + fmtTime(s) : "DELIVERED";
      if (!receipt) row.appendChild(el("div", "receipt", text));
      else receipt.textContent = text;
    } else if (receipt) receipt.remove();
  }

  function renderChat(opts) {
    opts = opts || {};
    const list = visibleList();
    const box = $("list");
    const near = nearBottom();
    const searching = !!query || filter !== "all" || !!dateFilter;
    const seen = cacheSeen;
    const lastMine = [...list].reverse().find(m => m.from === me);
    const unread = firstUnread();
    const firstUnreadId = unread ? unread.id : null;
    const shown = list.filter(m => matchesFilter(m) && (!query || (m.kind === "text" && (m.text || "").toLowerCase().includes(query))));
    matches = query ? shown.filter(m => m.kind === "text").map(m => m.id) : [];
    if (!query) matchIdx = -1;
    else if (matchIdx < 0 || matchIdx >= matches.length) matchIdx = matches.length - 1;

    const want = [];
    const pinned = (typeof cacheShared !== "undefined" && cacheShared.pinnedId && thread().find(x => x.id === cacheShared.pinnedId && !x.deleted)) || null;
    if (pinned) want.push({ key: "pin", pin: pinned });
    if (!list.length) want.push({ key: "empty" });
    let lastDay = "";
    shown.forEach((m, idx) => {
      const day = fmtDay(m.ts);
      if (day !== lastDay) { want.push({ key: "day:" + day, day }); lastDay = day; }
      if (m.id === firstUnreadId && !searching) want.push({ key: "new" });
      want.push({ key: rowKey(m), msg: m, last: m === lastMine, end: idx === shown.length - 1 });
    });
    if (searching && !shown.length) want.push({ key: "nomatch" });

    const have = new Map();
    [...box.children].forEach(n => { if (n.dataset.key) have.set(n.dataset.key, n); });
    let addedAtEnd = false;
    const next = [];
    for (const item of want) {
      let node = have.get(item.key);
      if (item.msg) {
        const struct = structureRev(item.msg);
        const chrome = chromeRev(item.msg, seen, item.last);
        if (!node) {
          node = buildRow(item.msg, seen, item.last);
          node.dataset.key = item.key;
          node.dataset.struct = struct;
          node.dataset.chrome = chrome;
          if (!reduceMotion()) {
            node.classList.add("fresh");
            requestAnimationFrame(() => node.classList.add("in"));
          }
          if (item.end) addedAtEnd = true;
        } else {
          have.delete(item.key);
          node.dataset.row = item.msg.id;
          const card = node.querySelector(".msg");
          if (card) card.dataset.id = item.msg.id;
          if (node.dataset.struct !== struct) {
            const neu = buildRow(item.msg, seen, item.last);
            neu.dataset.key = item.key;
            neu.dataset.struct = struct;
            neu.dataset.chrome = chrome;
            node.replaceWith(neu);
            node = neu;
          } else if (node.dataset.chrome !== chrome) {
            paintChrome(node, item.msg, seen, item.last);
            node.dataset.chrome = chrome;
          }
        }
      } else if (!node) {
        if (item.pin) {
          node = el("button", "pinbar");
          node.type = "button";
          node.dataset.key = item.key;
          node.dataset.pin = item.pin.id;
          node.textContent = "Pinned · " + (item.pin.kind === "text" ? (item.pin.text || "") : item.pin.kind).slice(0, 90);
          node.addEventListener("click", () => {
            const row = box.querySelector('[data-row="' + node.dataset.pin + '"]');
            if (row) row.scrollIntoView({ block: "center" });
          });
        } else if (item.day) {
          node = el("div", "day", item.day);
          node.dataset.key = item.key;
        } else if (item.key === "new") {
          node = el("div", "newline mono", "New");
          node.dataset.key = item.key;
        } else if (item.key === "empty") {
          node = el("div", "empty");
          node.dataset.key = item.key;
          node.append(el("b", "", "Nothing written yet."), document.createTextNode("Start with a line, a photo, or your voice."));
        } else {
          node = el("div", "empty", "Nothing matches that search.");
          node.dataset.key = item.key;
        }
      } else {
        have.delete(item.key);
        if (item.pin) {
          node.dataset.pin = item.pin.id;
          node.textContent = "Pinned · " + (item.pin.kind === "text" ? (item.pin.text || "") : item.pin.kind).slice(0, 90);
        }
      }
      next.push(node);
    }
    for (const n of have.values()) n.remove();
    next.forEach((node, i) => {
      if (box.children[i] !== node) box.insertBefore(node, box.children[i] || null);
    });

    $("qcount").textContent = query ? (matches.length ? (matchIdx + 1) + " / " + matches.length : "0") : "";
    knownIds = new Set(thread().map(m => m.id));
    if (opts.stick || (addedAtEnd && near)) box.scrollTop = box.scrollHeight;
    if (opts.seek && query && matches.length) highlightMatch();
    if (focusDay) {
      const hit = [...box.querySelectorAll(".row")].find(r => {
        const ts = Number(r.dataset.ts);
        return ts >= focusDay.start && ts < focusDay.end;
      });
      if (hit) hit.scrollIntoView({ block: "center" });
      focusDay = null;
    }
    for (const id of [...pendingFx]) {
      const node = box.querySelector('[data-row="' + id + '"] .msg');
      if (!node) continue;
      pendingFx.delete(id);
      const m = thread().find(x => x.id === id);
      if (m) landEffect(node, m.effect);
    }
    renderChips();
    renderPresence();
  }

  function highlightMatch() {
    document.querySelectorAll(".hit").forEach(n => n.classList.remove("hit"));
    const id = matches[matchIdx];
    const row = id && $("list").querySelector(`[data-row="${id}"]`);
    if (!row) return;
    row.querySelector(".msg").classList.add("hit");
    row.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  function stepMatch(d) {
    if (!matches.length) return;
    matchIdx = (matchIdx + d + matches.length) % matches.length;
    $("qcount").textContent = (matchIdx + 1) + " / " + matches.length;
    highlightMatch();
  }

  function renderChips() {
    const box = $("chips");
    box.textContent = "";
    const count = sched().filter(s => s.from === me).length;
    if (count) {
      const c = el("button", "chip on");
      c.innerHTML = ic("calendar", "sm") + count + " scheduled";
      c.addEventListener("click", () => openScheduled());
      box.appendChild(c);
    }
    const arch = archivedList().length;
    if (arch) {
      const c = el("button", "chip");
      c.innerHTML = ic("archive", "sm") + arch + " archived";
      c.addEventListener("click", () => openArchive());
      box.appendChild(c);
    }
    box.classList.toggle("hidden", !box.childNodes.length);
  }

  function renderPresence() {
    if (!me) return;
    const remote = (typeof presenceState !== "undefined" && presenceState[other()]) || null;
    const typing = Date.now() < (partnerTypingUntil || 0) || !!(remote && remote.typing && Date.now() - (remote.ts || 0) < 3000);
    const p = $("presence");
    p.classList.toggle("live", !!typing);
    let zoneTime = "";
    try { zoneTime = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", timeZone: S(other()).tz }); } catch {}
    const status = S(other()).status;
    p.textContent = typing ? "typing..." : (zoneTime ? NAME[other()] + " · " + zoneTime + (status ? " · " + status : "") : "private");
    $("typing").textContent = typing ? "typing..." : "";
    $("typing").classList.toggle("show", !!typing);
  }

  let bannerHide = 0;
  function renderBanner() {
    if (!unlocked || view !== "chat") return;
    const n = unreadN;
    if (n > 0 && !nearBottom()) {
      notice(n + (n === 1 ? " unread message" : " unread messages"), "From " + NAME[other()] + ". Jump to the first one?", { action: { label: "Jump", run: jumpToUnread } });
    } else if (prevUnread > 0 && n === 0) {
      notice("All caught up", "You have read everything from " + NAME[other()] + ".");
    }
    prevUnread = n;
  }

  function nearBottom() { const b = $("list"); return b.scrollHeight - b.scrollTop - b.clientHeight <= 80; }
  function scrollBottom() { const b = $("list"); b.scrollTo({ top: b.scrollHeight, behavior: "smooth" }); }

  async function markRead() {
    if (!unlocked || document.hidden || view !== "chat") return;
    cacheSeen[me] = Date.now();
    unreadN = 0;
    document.title = baseTitle;
    $("toBottom").classList.add("hidden");
    const client = cloudClient();
    if (!client) return;
    const res = await client.rpc("mark_read");
    if (!res.error) unreadN = 0;
    await refreshUnread();
  }

  function jumpToUnread() {
    const first = firstUnread();
    if (!first) return;
    const row = $("list").querySelector(`[data-row="${first.id}"]`);
    if (row) {
      row.scrollIntoView({ behavior: "smooth", block: "center" });
      row.querySelector(".msg").classList.add("hit");
      setTimeout(() => row.querySelector(".msg").classList.remove("hit"), 1400);
    }
  }

  function savePosition() {
    const side = me;
    if (view !== "chat" || !side) return;
    const box = $("list");
    const top = [...box.querySelectorAll(".row")].find(r => r.getBoundingClientRect().bottom > box.getBoundingClientRect().top + 8);
    if (!top) return;
    const pos = store.get(KEY.pos, {});
    pos[side] = top.dataset.row;
    store.set(KEY.pos, pos);
  }

  /* ================= Reply / edit bar ================= */
  function showBar(label, text) {
    $("replyLabel").textContent = label;
    $("replyText").textContent = text;
    $("replyBar").style.display = "flex";
  }
  function clearBar() { replyTo = null; editingId = null; $("replyBar").style.display = "none"; }
  function setReply(m) {
    editingId = null;
    replyTo = { id: m.id, from: m.from, preview: previewOf(m) };
    showBar("REPLY TO " + NAME[m.from].toUpperCase(), replyTo.preview);
    $("input").focus();
  }
  function startEdit(m) {

  /* ================= Vertical message menu (long press) ================= */
  let actionFor = null;
  function closeActions() {
    $("actionBar").classList.add("hidden");
    const menu = $("vmenu");
    if (menu) { menu.classList.add("hidden"); menu.textContent = ""; }
    actionFor = null;
  }
  function reactPop(card, emoji) {
    const r = card.getBoundingClientRect();
    const span = el("div", "fx2", emoji);
    span.style.left = (r.right - 18) + "px";
    span.style.top = r.top + "px";
    span.style.fontSize = "24px";
    document.body.appendChild(span);
    const done = () => span.remove();
    if (reduceMotion() || !span.animate) setTimeout(done, 400);
    else span.animate([
      { transform: "translate(-50%,-50%) scale(.5)", opacity: 0 },
      { transform: "translate(-50%,-70%) scale(1.1)", opacity: 1, offset: .5 },
      { transform: "translate(-50%,-110%) scale(1)", opacity: 0 }
    ], { duration: 800, easing: "cubic-bezier(.2,.8,.25,1)" }).onfinish = done;
  }
  function openActions(m) {
    closeThemeBar();
    actionFor = m.id;
    const menu = $("vmenu");
    menu.textContent = "";
    const card = document.querySelector('.msg[data-id="' + m.id + '"]');
    const mine = m.from === me;
    const age = Date.now() - m.ts;
    const hidden = (m.hiddenBy || []).includes(me);
    const add = (label, fn, danger) => {
      const b = el("button", danger ? "danger" : "", label);
      b.type = "button";
      b.addEventListener("click", (e) => { e.stopPropagation(); closeActions(); fn(); });
      menu.appendChild(b);
    };
    if (!m.deleted) add("Reply", () => setReply(m));
    if (!m.deleted && m.kind === "text" && m.text) add("Copy text", () => copyMessage(m));
    if (!m.deleted && mine && m.kind === "text") add("Edit", () => startEdit(m));
    if (!m.deleted) {
      const react = el("button", "", "React");
      react.type = "button";
      const row = el("div", "react-row");
      for (const em of [["♥", "❤"], ["😂", "😂"], ["😮", "😮"], ["👍", "👍"]]) {
        const rb = el("button", "", em[0]);
        rb.type = "button";
        rb.addEventListener("click", (e) => {
          e.stopPropagation();
          closeActions();
          if (card) reactPop(card, em[0]);
          if (em[0] === "♥") { if (!likedByMe(m)) toggleHeart(m.id); }
          else setEmoji(m.id, em[1]);
        });
        row.appendChild(rb);
      }
      react.addEventListener("click", (e) => { e.stopPropagation(); row.classList.toggle("open"); });
      menu.appendChild(react);
      menu.appendChild(row);
    }
    if (!m.deleted) menu.appendChild(el("hr"));
    if (!m.deleted) add(cacheShared.pinnedId === m.id ? "Unpin" : "Pin", () => setPinned(m.id));
    if (!m.deleted) add(hidden ? "Unhide" : "Hide", () => setHidden(m.id, !hidden));
    add("Delete for me", () => deleteForMe(m.id), true);
    if (mine && age < DELETE_ALL_MS && !m.deleted) add("Delete for both", () => deleteForEveryone(m.id), true);
    if (!m.deleted) add(m.moment ? "Moment off" : "Moment on", () => setMoment(m.id, !m.moment));
    menu.classList.remove("hidden");
    const anchor = card || document.querySelector('[data-row="' + m.id + '"]');
    const r = anchor ? anchor.getBoundingClientRect() : { left: 16, right: 200, top: 80, bottom: 140 };
    const mw = menu.offsetWidth || 240;
    const mh = menu.offsetHeight || 360;
    let top = r.bottom + 8;
    if (top + mh > window.innerHeight - 12) top = Math.max(12, r.top - mh - 8);
    let left = mine ? r.right - mw : r.left;
    left = Math.max(12, Math.min(left, window.innerWidth - mw - 12));
    top = Math.max(12, Math.min(top, window.innerHeight - mh - 12));
    menu.style.top = top + "px";
    menu.style.left = left + "px";
  }

  /* ================= Theme bar (long press on empty space) ================= */
  function openThemeBar() {
    closeActions();
    const acts = $("themeActs");
    acts.textContent = "";
    const cur = SH().theme;
    for (const t of THEMES) {
      const b = el("button", "tchip" + (cur === t.id ? " on" : ""));
      const sw = el("span", "swatch");
      sw.style.background = t.sw;
      b.append(sw, el("span", "", t.name));
      b.addEventListener("click", () => { setSH({ theme: t.id }); applyTheme(); openThemeBar(); haptic("press"); });
      acts.appendChild(b);
    }
    $("themeBar").classList.remove("hidden");
  }
  function closeThemeBar() { $("themeBar").classList.add("hidden"); }

  function applyTheme() {
    const t = SH().theme;
    let name = t;
    if (t === "auto") { const h = new Date().getHours(); name = (h >= 19 || h < 6) ? "ink" : "warm"; }
    document.documentElement.dataset.theme = name;
    document.querySelector('meta[name="color-scheme"]').content = (name === "ink" || name === "glass") ? "dark" : "light";
  }

  /* ================= Sheets: structured forms ================= */
  function sheetOpen(build) {
    const body = $("sheetBody");
    body.textContent = "";
    body.appendChild(el("div", "grab"));
    build(body);
    $("sheet").classList.remove("hidden");
  }
  function sheetClose(resolve) { $("sheet").classList.add("hidden"); $("sheetBody").textContent = ""; if (resolve) resolve(null); }
  $("sheetScrim").addEventListener("click", () => sheetClose());

  /* formPanel: title, description, labelled fields, inline error, primary and cancel. Resolves with values or null. */
  function formPanel(o) {
    return new Promise((resolve) => {
      sheetOpen((body) => {
        body.appendChild(el("h3", "fp-title", o.title));
        if (o.desc) body.appendChild(el("p", "fp-desc", o.desc));
        const inputs = {};
        for (const f of o.fields) {
          const wrap = el("div", "fp-field");
          wrap.appendChild(el("label", "", f.label));
          let i;
          if (f.type === "select") {
            i = el("select", "in plain");
            f.options.forEach((t, idx) => { const op = el("option", "", t); op.value = String(idx); i.appendChild(op); });
            i.value = String(f.value || 0);
          } else {
            i = el("input", "in plain");
            i.type = f.type || "text";
            i.placeholder = f.placeholder || "";
            i.value = f.value || "";
            i.autocapitalize = "none";
            i.spellcheck = false;
          }
          inputs[f.key] = i;
          if (f.type === "password") {
            const slot = el("div", "");
            slot.style.position = "relative";
            i.style.paddingRight = "40px";
            const peek = el("button", "");
            peek.type = "button";
            peek.setAttribute("aria-label", "Show passphrase");
            peek.innerHTML = ic("eye", "sm");
            peek.style.cssText = "position:absolute;right:8px;top:50%;transform:translateY(-50%)";
            peek.addEventListener("click", (ev) => {
              ev.preventDefault();
              const show = i.type === "password";
              i.type = show ? "text" : "password";
              peek.setAttribute("aria-label", show ? "Hide passphrase" : "Show passphrase");
            });
            slot.append(i, peek);
            wrap.appendChild(slot);
          } else wrap.appendChild(i);
          body.appendChild(wrap);
        }
        const err = el("div", "fp-err");
        body.appendChild(err);
        const acts = el("div", "fp-acts");
        const cancel = el("button", "btn ghost", o.cancel || "Cancel");
        const go = el("button", "btn" + (o.danger ? " danger" : ""), o.submit || "Continue");
        const submit = () => {
          const vals = {};
          for (const f of o.fields) vals[f.key] = inputs[f.key].value;
          const msg = o.validate ? o.validate(vals) : null;
          if (msg) { err.textContent = msg; haptic("error"); return; }
          $("sheet").classList.add("hidden");
          $("sheetBody").textContent = "";
          resolve(vals);
        };
        cancel.addEventListener("click", () => sheetClose(resolve));
        go.addEventListener("click", submit);
        Object.values(inputs).forEach(i => i.addEventListener("keydown", (e) => { if (e.key === "Enter" && i.tagName !== "SELECT") submit(); }));
        acts.append(cancel, go);
        body.appendChild(acts);
        setTimeout(() => { const first = Object.values(inputs)[0]; first && first.focus(); }, 80);
      });
      $("sheetScrim").onclick = () => sheetClose(resolve);
    });
  }

  /* choicePanel: a short structured choice, one option per row. */
  function choicePanel(o) {
    return new Promise((resolve) => {
      sheetOpen((body) => {
        body.appendChild(el("h3", "fp-title", o.title));
        if (o.desc) body.appendChild(el("p", "fp-desc", o.desc));
        for (const c of o.options) {
          const b = el("button", "choice" + (c.danger ? " danger" : ""));
          b.append(el("b", "", c.label), el("small", "", c.sub || ""));
          b.addEventListener("click", () => { $("sheet").classList.add("hidden"); $("sheetBody").textContent = ""; resolve(c.value); });
          body.appendChild(b);
        }
        const cancel = el("button", "btn ghost wide", "Cancel");
        cancel.style.marginTop = "6px";
        cancel.addEventListener("click", () => sheetClose(resolve));
        body.appendChild(cancel);
      });
      $("sheetScrim").onclick = () => sheetClose(resolve);

  function openDelete(m) {
    const mine = m.from === me;
    const age = Date.now() - m.ts;
    const opts = [{ label: "Delete for me", sub: "Removes it from your side only. " + NAME[other()] + " still sees it.", value: "me" }];
    if (mine && age < DELETE_ALL_MS) opts.push({ label: "Delete for both", sub: "Replaces it with a deleted note on both sides. Available for 24 hours.", value: "all", danger: true });
    choicePanel({ title: "Delete message", desc: "Choose what should happen to this message.", options: opts }).then(v => {
      if (v === "me") deleteForMe(m.id);
      else if (v === "all") deleteForEveryone(m.id);

  function openHistory(m) {
    sheetOpen((body) => {
      body.appendChild(el("h3", "fp-title", "Edited"));
      body.appendChild(el("p", "fp-desc", "Earlier versions of this message, newest first."));

  /* ================= Full-screen panels ================= */
  let panelBuild = null, panelBackTo = "home";
  function showView(name) {
    view = name;
    ["lock", "home", "chat", "panel"].forEach(v => { const n = $(v); if (n) n.classList.toggle("hidden", v !== name); });
    closeActions(); closeThemeBar();

    $("panelSub").textContent = sub || "";
    $("panelRight").textContent = "";

  function renderPanel() {

    const body = $("panelBody");

  function goBack() {
    if (view === "panel") { panelBuild = null; return showView(panelBackTo); }

    if (view === "home") return;
  }

  function group(title, rows) {

  function openCalendar() {

    openPanel("Calendar", "Messages by day", (body) => {
      const nav = el("div", "calnav");
      const prev = el("button", "btn sm ghost", "Prev");

      label.style.flex = "1";

      for (let y = yNow - 5; y <= yNow + 1; y++) {

        o.value = String(y);
        year.appendChild(o);
      }
      const grid = el("div", "calgrid");
      const listBox = el("div", "");
      const draw = () => {
        const y = calCursor.getFullYear();
        const m = calCursor.getMonth();
        year.value = String(Math.min(yNow + 1, Math.max(yNow - 5, y)));
        label.textContent = calCursor.toLocaleString([], { month: "long", year: "numeric" });
        grid.textContent = "";
        ["S", "M", "T", "W", "T", "F", "S"].forEach(d => grid.appendChild(el("div", "caldow", d)));
        const pad = new Date(y, m, 1).getDay();
        const days = new Date(y, m + 1, 0).getDate();
        for (let i = 0; i < pad; i++) grid.appendChild(el("div", ""));
        const today = new Date();
        for (let d = 1; d <= days; d++) {
          const b = el("button", "calday", String(d));
          b.type = "button";
          if (d === today.getDate() && m === today.getMonth() && y === today.getFullYear()) b.classList.add("on");

          grid.appendChild(b);
        }
      };
      prev.addEventListener("click", () => { calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() - 1, 1); draw(); });
      next.addEventListener("click", () => { calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() + 1, 1); draw(); });
      year.addEventListener("change", () => { calCursor = new Date(Number(year.value), calCursor.getMonth(), 1); draw(); });

  async function loadCalendarDay(y, m, d, box) {
    const start = new Date(y, m, d, 0, 0, 0, 0);
    const end = new Date(y, m, d + 1, 0, 0, 0, 0);
    box.textContent = "";
    box.appendChild(el("p", "fp-desc", "Loading…"));
    const client = cloudClient();
    if (!client || !pairId) { box.textContent = ""; box.appendChild(el("p", "fp-desc", "Sign in to see this day.")); return; }
    const res = await client.from("messages").select("id,sender_id,kind,text,created_at,deleted,deleted_for")
      .eq("pair_id", pairId)
      .gte("created_at", start.toISOString())
      .lt("created_at", end.toISOString())
      .eq("deleted", false)
      .order("created_at");
    box.textContent = "";
    if (res.error) { box.appendChild(el("p", "fp-desc", res.error.message)); return; }
    const rows = (res.data || []).filter(r => !(r.deleted_for || []).includes(me));
    if (!rows.length) box.appendChild(el("p", "fp-desc", "No messages this day."));
    for (const r of rows) {
      const it = el("div", "item");
      const side = rowSide(r.sender_id) || "";
      const preview = (r.kind === "text" ? (r.text || "") : r.kind === "image" ? "Photo" : "Voice note").slice(0, 80);
      const t = el("div", "txt");
      t.append(el("span", "", preview), el("small", "", fmtTime(new Date(r.created_at).getTime()) + " · " + (NAME[side] || "")));
      it.appendChild(t);
      box.appendChild(it);
    }
    const open = el("button", "btn wide", "Open conversation");
    open.style.marginTop = "12px";
    open.addEventListener("click", () => openChat(false, { day: { start: start.getTime(), end: end.getTime() } }));
    box.appendChild(open);
  }

  const b64 = (buf) => { let s = ""; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = (str) => Uint8Array.from(atob(str), c => c.charCodeAt(0));
  async function deriveKey(pass, salt) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 150000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  }

  async function makeBackup() {
    const v = await formPanel({
      title: "Encrypted backup",
      desc: "Choose a passphrase for this backup. You will need it to restore. It is not stored anywhere.",
      fields: [{ key: "p", label: "Backup passphrase", type: "password", placeholder: "At least 6 characters" }],
      submit: "Create backup",
      validate: (x) => (x.p.length < 6 ? "Use at least 6 characters." : null)
    });
    if (!v) return;
    const media = [];
    for (const m of thread()) if (m.mid) { const b = await getBlob(m.mid); if (b) media.push({ id: m.mid, data: await readURL(b) }); }
    const payload = JSON.stringify({ thread: thread(), media, notes: notesAll(), shared: SH(), settings: store.get(KEY.settings, {}) });
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await deriveKey(v.p, salt);
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(payload));
    download("our-conversation-" + new Date().toISOString().slice(0, 10) + ".ppbak", JSON.stringify({ v: 1, salt: b64(salt), iv: b64(iv), ct: b64(ct) }), "application/json");
    notice("Encrypted backup saved", "Keep the file and its passphrase somewhere safe.");
  }

  async function restoreBackup(file) {
    const v = await formPanel({
      title: "Restore backup",
      desc: "Enter the passphrase you chose for this backup. Messages are merged with what is already here, never overwritten.",
      fields: [{ key: "p", label: "Backup passphrase", type: "password" }],
      submit: "Restore"
    });
    if (!v) return;
    try {
      const f = JSON.parse(await file.text());
      const key = await deriveKey(v.p, unb64(f.salt));
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(f.iv) }, key, unb64(f.ct));
      const data = JSON.parse(new TextDecoder().decode(pt));
      for (const x of data.media || []) await putBlob(x.id, await b64ToBlob(x.data));
      const list = thread();
      const have = new Set(list.map(m => m.id));
      for (const m of data.thread || []) if (!have.has(m.id)) list.push(m);
      list.sort((a, b) => a.ts - b.ts);
      saveThread(list);
      const nl = notesAll(), nh = new Set(nl.map(n => n.id));
      for (const n of data.notes || []) if (!nh.has(n.id)) nl.push(n);
      cacheNotes = nl;
      if (data.shared) setSH(data.shared);
      if (data.settings) { for (const side of Object.keys(data.settings)) setS(side, data.settings[side]); }
      render();
      renderHome();
      notice("Backup restored", "Messages, notes, shared settings, and each side's settings were merged.");
    } catch { notice("Couldn't open that backup", "Check the passphrase, or make sure the file is complete.", { error: true }); }
  }

  async function compressImage(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const s = Math.min(1, IMG_MAX / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      return await new Promise(res => c.toBlob(res, "image/jpeg", 0.86));
    } finally { URL.revokeObjectURL(url); }
  }

  function audioDuration(blob) {
    return new Promise(res => {
      const url = URL.createObjectURL(blob);
      const a = new Audio();
      a.preload = "metadata";
      a.onloadedmetadata = () => { res(isFinite(a.duration) ? Math.round(a.duration) : 0); URL.revokeObjectURL(url); };
      a.onerror = () => { res(0); URL.revokeObjectURL(url); };
      a.src = url;
    });
  }

  async function handleFiles(files) {
    for (const f of [...files]) {
      try {
        if (f.type.startsWith("image/")) { const blob = await compressImage(f); if (!blob) { notice("Couldn't save that photo", "Try a different image.", { error: true }); continue; } await addMedia("image", blob, {}); }
        else if (f.type.startsWith("audio/")) await addMedia("audio", f, { dur: await audioDuration(f), mime: f.type });
        else notice("That file type isn't supported", "Choose a photo or an audio file.", { error: true });
      } catch { notice("Couldn't add " + (f.name || "that file"), "", { error: true }); }
    }
  }

    if (micPrimed || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    try {
