  async function startRecording() {
    if (rec || startRecording.busy) return;
    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) { notice("Recording isn't available here", "Attach an audio file instead."); return; }
    startRecording.busy = true;
    recWantStop = false;
    $("footer").classList.add("hidden");
    $("recbar").classList.remove("hidden");
    $("rectime").textContent = "0:00";
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch {
      $("recbar").classList.add("hidden");
      $("footer").classList.remove("hidden");
      startRecording.busy = false;
      notice("Microphone is blocked", "Allow the microphone, or attach an audio file.", { error: true });
      return;
    }
    if (recWantStop) {
      stream.getTracks().forEach(t => t.stop());
      $("recbar").classList.add("hidden");
      $("footer").classList.remove("hidden");
      startRecording.busy = false;
      recWantStop = false;
      return;
    }
    ensureAudio();
    recStream = stream;
    recAnalyser = audioCtx.createAnalyser();
    recAnalyser.fftSize = 256;
    audioCtx.createMediaStreamSource(stream).connect(recAnalyser);
    const type = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"].find(t => MediaRecorder.isTypeSupported(t)) || "";
    rec = new MediaRecorder(stream, { ...(type ? { mimeType: type } : {}), audioBitsPerSecond: 32000 });
    recChunks = [];
    rec.ondataavailable = (e) => { if (e.data.size) recChunks.push(e.data); };
    rec.start();
    recStart = Date.now();
    recHistory = [];
    drawWave();
    recTimer = setInterval(() => {
      const s = (Date.now() - recStart) / 1000;
      $("rectime").textContent = fmtDur(s);
      lastActivity = Date.now();
      if (s * 1000 >= REC_MAX_MS) stopRecording(true);
    }, 200);
    startRecording.busy = false;
  }

  function stopRecording(sendIt) {
    if (startRecording.busy && !rec) { recWantStop = true; return; }
    if (!rec) return;
    const r = rec;
    const stream = recStream;
    const dur = Math.max(1, Math.round((Date.now() - recStart) / 1000));
    rec = null;
    cancelAnimationFrame(recRAF);
    clearInterval(recTimer);
    $("recbar").classList.add("hidden");
    $("footer").classList.remove("hidden");
    r.onstop = async () => {
      stream?.getTracks().forEach(t => t.stop());
      recStream = null;
      const chunks = recChunks;
      recChunks = [];
      if (sendIt && chunks.length) {
        const blob = new Blob(chunks, { type: r.mimeType || "audio/webm" });
        await addMedia("audio", blob, { dur, mime: blob.type });
      }
    };
    try { if (r.state === "recording") r.requestData(); } catch {}
    if (r.state !== "inactive") r.stop(); else r.onstop();
  }

  function drawWave() {
    const c = $("wave"), g = c.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    const w = c.clientWidth, h = c.clientHeight;
    if (c.width !== Math.floor(w * dpr) || c.height !== Math.floor(h * dpr)) {
      c.width = Math.max(1, Math.floor(w * dpr));
      c.height = Math.max(1, Math.floor(h * dpr));
    }
    const buf = new Uint8Array(recAnalyser.frequencyBinCount);
    const loop = () => {
      if (!rec) return;
      recAnalyser.getByteTimeDomainData(buf);
      let peak = 0;
      for (const v of buf) peak = Math.max(peak, Math.abs(v - 128));
      recHistory.push(peak / 128);
      const cap = Math.floor(w / 4);
      if (recHistory.length > cap) recHistory.splice(0, recHistory.length - cap);
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, w, h);
      g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#9a5a48";
      recHistory.forEach((a, i) => {
        const bh = Math.min(h, Math.max(3, a * h * 1.6));
        g.globalAlpha = 0.35 + 0.65 * (i / recHistory.length);
        g.fillRect(i * 4, (h - bh) / 2, 2, bh);
      });
      g.globalAlpha = 1;
      recRAF = requestAnimationFrame(loop);
    };
    loop();
  }

  async function setAppIcon(file) {
    const url = URL.createObjectURL(file);
    let dataUrl;
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const c = document.createElement("canvas");
      c.width = 512; c.height = 512;
      const g = c.getContext("2d");
      const s = Math.max(512 / img.width, 512 / img.height);
      const w = img.width * s, h = img.height * s;
      g.drawImage(img, (512 - w) / 2, (512 - h) / 2, w, h);
      dataUrl = c.toDataURL("image/jpeg", 0.85);
    } finally { URL.revokeObjectURL(url); }
    if (!dataUrl || dataUrl.length > 300000) { notice("Image too large", "", { error: true }); return; }
    const client = cloudClient();
    if (!client || !pairId) return;
    const upd = await client.from("pair_settings").update({ app_icon: dataUrl }).eq("pair_id", pairId);

  async function uploadAvatar(file) {

      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const max = 512;
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      blob = await new Promise(res => c.toBlob(res, "image/jpeg", 0.85));

    if (String(id).startsWith("local-")) { notice("Send it first", "Reactions wait until the message is sent."); return; }
    const client = cloudClient();
    if (!client) return;
    const res = await client.rpc("set_emoji", { p_id: id, p_emoji: emoji });
    if (res.error) { notice("Couldn't react", res.error.message, { error: true }); return; }
    await reloadAll();
    render();
  }
  async function copyMessage(m) {
    try {
      await navigator.clipboard.writeText(m.text || "");
      notice("Copied");
    } catch { notice("Couldn't copy", "The browser blocked the clipboard.", { error: true }); }
  }
  async function setPinned(id) {
    if (String(id).startsWith("local-")) { notice("Send it first", "Pin waits until the message is sent."); return; }
    const client = cloudClient();
    if (!client || !pairId) return;
    const next = cacheShared.pinnedId === id ? null : id;
    const upd = await client.from("pair_settings").update({ pinned_message_id: next }).eq("pair_id", pairId);
    if (upd.error) { notice("Couldn't pin that", upd.error.message, { error: true }); return; }
    cacheShared.pinnedId = next;
    render();
  }
  async function setHidden(id, on) {
    const client = cloudClient();
    if (!client) return;
    const res = await client.rpc("set_hidden", { p_id: id, p_on: on });
    if (res.error) { notice("Couldn't update that", res.error.message, { error: true }); return; }
    await reloadAll();
    render();
    haptic("press");
    notice(on ? "Blurred for you" : "Visible again", on ? "Hold the message to read it." : "");
  }
  async function setMoment(id, on) {
    const client = cloudClient();
    if (!client) return;
    const res = await client.rpc("set_moment", { p_id: id, p_on: on });
    if (res.error) { notice("Couldn't update that", res.error.message, { error: true }); return; }
    await reloadAll();
    render();
    haptic("pin");
    notice(on ? "Pinned to Moments" : "Removed from Moments", on ? "You will find it under Moments." : "");
  }
  async function deleteForMe(id) {
    const client = cloudClient();
    if (!client) return;
    const res = await client.rpc("delete_for_me", { p_id: id });
    if (res.error) { notice("Couldn't delete that", res.error.message, { error: true }); return; }
    await reloadAll();
    render();
    notice("Deleted from your view", "The other side still has it.");
  }
  async function deleteForEveryone(id) {
    const client = cloudClient();
    if (!client) return;
    const m = thread().find(x => x.id === id);
    if (m && m.mid && String(m.mid).startsWith("local-")) await delBlob(m.mid);
    voiceCache.get(id)?._audio.pause();
    voiceCache.delete(id);
    const res = await client.rpc("delete_for_both", { p_id: id });
    if (res.error) { notice("Couldn't delete that", res.error.message, { error: true }); return; }
    await reloadAll();
    render();
    haptic("error");
    notice("Deleted for both", "The message now shows as deleted on both sides.");
  }
  function markNotesRead(side) {
    const ids = notesFrom(side).map(n => n.id);
    ids.forEach(id => { cacheNread[id] = true; });
    const client = cloudClient();
    if (!client || !myUserId) return;
    const rows = ids.map(id => ({ user_id: myUserId, note_id: id }));
    if (rows.length) client.from("note_reads").upsert(rows);
  }
  function unreadNotesCount() {
    return notesFrom(other()).filter(n => !cacheNread[n.id]).length;
  }
  async function addNote(kind, text) {
    const client = cloudClient();
    if (!client) return;
    const ins = await client.from("notes").insert({ pair_id: pairId, author_id: myUserId, side: me, kind, text: text.slice(0, NOTE_MAX) });
    if (ins.error) { notice("Couldn't share that note", ins.error.message, { error: true }); return; }
    haptic("pin");
    await reloadAll();
  }
  async function saveNoteEdit(id, text) {
    const client = cloudClient();
    if (!client) return;
    const upd = await client.from("notes").update({ text: text.slice(0, NOTE_MAX), edited: true }).eq("id", id);
    if (upd.error) { notice("Couldn't save the note", upd.error.message, { error: true }); return; }
    await reloadAll();
  }
  async function removeNote(id) {
    const client = cloudClient();
    if (!client) return;
    const gone = await client.from("notes").delete().eq("id", id);
    if (gone.error) { notice("Couldn't delete that note", gone.error.message, { error: true }); return; }
    await reloadAll();
  }
  async function trackTyping(on) {
    if (on && typeChannel) {
      try { await typeChannel.send({ type: "broadcast", event: "typing", payload: { side: me } }); } catch {}
    }
  }
  async function unlock(side) {
    me = side;
    store.set(KEY.last, side);
    unlocked = true;
    lastActivity = Date.now();
    ensureAudio();
    $("input").value = (store.get(KEY.drafts, {})[me]) || "";
    autosize();
    const opened = await openCloud(side);
    if (!opened) { unlocked = false; me = null; showView("lock"); return; }
    rememberSide(side);
    prevUnread = unreadN;
    applyTheme();
    showView("home");
    renderHome();
    deliverDue();
    haptic("recv");
  }
  async function cloudSignIn(e) {
    e.preventDefault();
    if (!chosen) return;
    const client = cloudClient();
    if (!client) return;
    const password = $("pass").value;
    $("pass").value = "";
    const res = await client.auth.signInWithPassword({ email: SIDE_EMAIL[chosen], password });
    if (res.error) {
      const fails = (store.get(KEY.fail, {})[chosen] || 0) + 1;
      const all = store.get(KEY.fail, {});
      all[chosen] = fails;
      store.set(KEY.fail, all);
      $("lockErr").textContent = "That isn't right.";
      if (fails >= 4) { $("forgot").classList.remove("hidden"); showLockMode("recover"); }
      haptic("error");
      const p = $("pass");
      p.classList.remove("shake"); void p.offsetWidth; p.classList.add("shake");
      return;
    }
    const all = store.get(KEY.fail, {});
    all[chosen] = 0;
    store.set(KEY.fail, all);
    $("lockErr").textContent = "";
    rememberSide(chosen);
    unlock(chosen);
  }
  async function cloudSetup(e) {
    e.preventDefault();
    const client = cloudClient();
    if (!client) return;
    const p1 = $("sp1").value, p2 = $("sp2").value;
    const q1 = +$("sq1").value, q2 = +$("sq2").value;
    const a1 = normAnswer($("sa1").value), a2 = normAnswer($("sa2").value);
    if (p1.length < 4) { $("lockErr").textContent = "Use at least 4 characters."; return; }
    if (p1 !== p2) { $("lockErr").textContent = "The two passphrases don't match."; haptic("error"); return; }
    if (q1 === q2) { $("lockErr").textContent = "Choose two different questions."; return; }
    if (a1.length < 2 || a2.length < 2) { $("lockErr").textContent = "Write both answers."; return; }
    const res = await client.auth.signUp({ email: SIDE_EMAIL[chosen], password: p1 });
    if (res.error) {
      if (/already/i.test(res.error.message)) {
        showLockMode("signin");
        $("lockErr").textContent = "Sign in with your passphrase.";
        return;
      }
      $("lockErr").textContent = res.error.message;
      return;
    }
    if (!res.data.session) {
      const again = await client.auth.signInWithPassword({ email: SIDE_EMAIL[chosen], password: p1 });
      if (again.error) { $("lockErr").textContent = again.error.message; return; }
    }
    ["sp1", "sp2", "sa1", "sa2"].forEach(id => $(id).value = "");
    const opened = await (async () => { me = chosen; return openCloud(chosen); })();
    if (!opened) { $("lockErr").textContent = "The side could not be opened."; return; }
    const rec = await client.functions.invoke("setup-recovery", { body: { q1, q2, a1, a2 } });
    if (rec.error || (rec.data && rec.data.error)) {
      notice("Passphrase saved, recovery answers were not", "Open Settings later and try again.", { error: true });
    }
    rememberSide(chosen, { known: true, qs: [{ q: QUESTIONS[q1] }, { q: QUESTIONS[q2] }] });
    unlocked = true;
    lastActivity = Date.now();
    ensureAudio();
    prevUnread = 0;
    applyTheme();
    showView("home");
    renderHome();
    haptic("recv");
  }
  async function cloudRecover(e) {
    e.preventDefault();
    const client = cloudClient();
    if (!client) return;
    const password = $("rp1").value;
    const res = await client.functions.invoke("recovery-reset", {
      body: { side: chosen, a1: normAnswer($("ra1").value), a2: normAnswer($("ra2").value), password }
    });
    const payload = res.data || {};
    if (res.error || payload.error) {
      $("lockErr").textContent = payload.error || "Those answers don't match.";
      haptic("error");
      return;
    }
    ["ra1", "ra2", "rp1"].forEach(id => $(id).value = "");
    showLockMode("signin");
    $("lockErr").textContent = "New passphrase saved. Sign in with it.";
  }
  function rebindAuthForms() {
    const swap = (id) => {
      const node = $(id);
      const copy = node.cloneNode(true);
      node.replaceWith(copy);
      return copy;
    };
    swap("lockForm").addEventListener("submit", cloudSignIn);
    swap("setupForm").addEventListener("submit", cloudSetup);
    swap("recoverForm").addEventListener("submit", cloudRecover);
    $("forgot").addEventListener("click", () => { showLockMode("recover"); void loadPrompts(); });
    $("recCancelBtn").addEventListener("click", () => showLockMode("signin"));
    $("peek").addEventListener("click", () => {
      const p = $("pass");
      const show = p.type === "password";
      p.type = show ? "text" : "password";
      $("peek").setAttribute("aria-label", show ? "Hide passphrase" : "Show passphrase");
    });
  ["peek1","peek2","peek3"].forEach(id => {
    const b = $(id);
    if (!b) return;
    b.addEventListener("click", (e) => {
      e.preventDefault();
      const inp = id === "peek1" ? $("sp1") : id === "peek2" ? $("sp2") : $("rp1");
      if (!inp) return;
      const show = inp.type === "password";
      inp.type = show ? "text" : "password";
      b.setAttribute("aria-label", show ? "Hide passphrase" : "Show passphrase");
    });
  });

    if ($("sq2")) $("sq2").selectedIndex = 1;
  }
  async function loadPrompts() {
    const client = cloudClient();
    if (!client || !chosen) return;
    const res = await client.rpc("recovery_prompts", { p_side: chosen });
    const row = (res.data || [])[0];
    if (!row) { $("rq1l").textContent = "Recovery is not set up on this side."; $("rq2l").textContent = ""; return; }
    $("rq1l").textContent = QUESTIONS[row.q1] || "";
    $("rq2l").textContent = QUESTIONS[row.q2] || "";
  }
  async function changePassphrase() {
    const client = cloudClient();
    if (!client) return;
    const v = await formPanel({
      title: "Change passphrase",
      desc: "Enter your current passphrase, then choose a new one. Only your side changes.",
      fields: [
        { key: "cur", label: "Current passphrase", type: "password" },
        { key: "next", label: "New passphrase", type: "password", placeholder: "At least 4 characters" },
        { key: "again", label: "Repeat new passphrase", type: "password" }
      ],
      submit: "Change passphrase",
      validate: (x) => null
    });
    if (!v) return;
    if (v.next.length < 4) { notice("Too short", "Use at least 4 characters.", { error: true }); return; }
    if (v.next !== v.again) { notice("Those don't match", "Type the new passphrase twice.", { error: true }); return; }
    const check = await client.auth.signInWithPassword({ email: SIDE_EMAIL[me], password: v.cur });
    if (check.error) { notice("Current passphrase is wrong", "Nothing was changed.", { error: true }); return; }
    const upd = await client.auth.updateUser({ password: v.next });
    if (upd.error) { notice("Couldn't change the passphrase", upd.error.message, { error: true }); return; }
    notice("Passphrase changed", "Use the new one the next time you sign in.");
  }
  async function editRecovery() {
    const client = cloudClient();
    if (!client) return;
    const v = await formPanel({
      title: "Recovery questions",
      desc: "Choose each question and edit each answer. You are not asked again at sign-in.",
      fields: [
        { key: "q1", label: "First question", type: "select", options: QUESTIONS, value: 0 },
        { key: "a1", label: "First answer", placeholder: "Answer" },
        { key: "q2", label: "Second question", type: "select", options: QUESTIONS, value: 1 },
        { key: "a2", label: "Second answer", placeholder: "Answer" }
      ],
      submit: "Save recovery"
    });
    if (!v) return;
    const q1 = +v.q1, q2 = +v.q2;
    const a1 = normAnswer(v.a1), a2 = normAnswer(v.a2);
    if (q1 === q2) { notice("Choose two different questions", "", { error: true }); return; }
    if (a1.length < 2 || a2.length < 2) { notice("Write both answers", "", { error: true }); return; }
    const rec = await client.functions.invoke("setup-recovery", { body: { q1, q2, a1, a2 } });
    if (rec.error || (rec.data && rec.data.error)) { notice("Couldn't save recovery", (rec.data && rec.data.error) || "Try again.", { error: true }); return; }
    rememberSide(me, { known: true, qs: [{ q: QUESTIONS[q1] }, { q: QUESTIONS[q2] }] });
    notice("Recovery saved", "Sign-in still asks only for your passphrase.");
  }
  async function signOutEverywhere() {
    const client = cloudClient();
    if (!client) return;
    const res = await client.auth.signOut({ scope: "others" });
    if (res.error) { notice("Couldn't sign out the other devices", res.error.message, { error: true }); return; }
    notice("Other devices signed out", "They will need the passphrase the next time they open this.");
  }
  const signedCache = new Map();
  function readSigned(id) {
    const hit = signedCache.get(id);
    if (!hit) return null;
    if (hit.exp - Date.now() > 60000) return hit.url;
    return null;
  }
  function putSigned(id, url, ttl) {
    signedCache.set(id, { url, exp: Date.now() + ttl * 1000 });
    return url;
  }
  async function mediaURL(id) {
    if (!id) return null;
    const cached = readSigned(id);
    if (cached) return cached;
    try {
      if (String(id).startsWith("local-")) {
        const b = await getBlob(id);
        if (!b) return null;
        const u = URL.createObjectURL(b);
        return putSigned(id, u, 86400);
      }
      const client = cloudClient();
      if (!client) return null;
      const signed = await client.storage.from("media").createSignedUrl(id, 600);
      if (signed.error || !signed.data || !signed.data.signedUrl) return null;
      return putSigned(id, signed.data.signedUrl, 600);
    } catch { return null; }
  }
  function seenMap() { return cacheSeen; }

  // Start.
  applyTheme();
  if (document.hidden) document.body.classList.add("private");
  bindAvatar($("homeAvatar"));
  bindAvatar($("chatAvatar"));
  primeMic(false);
  const askMicOnGesture = () => { if (!micPrimed && !micGestureTried) primeMic(true); };
  document.addEventListener("pointerdown", askMicOnGesture, true);
  document.addEventListener("keydown", askMicOnGesture, true);
  (async () => {
    rebindAuthForms();
    const client = cloudClient();
    if (client) await loadPublicLabels();
    if (client) {
      const { data } = await client.auth.getSession();
      if (data.session) {
        const side = Object.keys(SIDE_EMAIL).find(k => SIDE_EMAIL[k] === data.session.user.email);
        if (side) {
          me = side; chosen = side; lastActivity = Date.now();
          const ok = await openCloud(side);
          if (ok) { unlocked = true; showView("home"); renderHome(); return; }
        }
      }
    }
    applyRemembered();
    autosize();
    $("pass").focus();
  })();
})();
</script>
</body>
</html>
